    } else if (p.RRULE) {
      masters.push(ev);
    } else if (!ev.cancel && s.ms <= to && s.ms + Math.max(ev.dur, 1) > from) {
      out.push(agOut(ev, s.ms, cal));
    }
  }
  masters.forEach(function (ev) {
    if (ev.cancel) { return; }
    var skip = moved[ev.uid] || {};
    (ev.p.EXDATE || []).forEach(function (x) {
      x.v.split(",").forEach(function (v) { var t = agTime({ v: v, tz: x.tz }, ev.s.zone); if (t) { skip[t.ms] = true; } });
    });
    try {
      agExpand(ev, ev.p.RRULE.v, from, to, function (t) { if (!skip[t]) { out.push(agOut(ev, t, cal)); } });
    } catch (err) {}
  });
  return out;
}
function agOut(ev, t, cal) {
  return { c: cal, t: agText(ev.p.SUMMARY ? ev.p.SUMMARY.v : "") || "Occupé", l: agText(ev.p.LOCATION ? ev.p.LOCATION.v : ""),
           s: t, e: t + ev.dur, all: ev.s.all };
}

/* ---------- Chargement ---------- */
function agWindow() { var d = dayStart(new Date()); return [d.getTime() - 864e5, d.getTime() + 23 * 864e5]; }

function agLoad() {
  var key = store.get(AG_KEY);
  if (!key || ag.loading) { return; }
  ag.loading = true;
  var xhr = new XMLHttpRequest();
  xhr.open("GET", CONFIG.planeProxy.replace(/\/+$/, "") + "/agenda", true);
  xhr.setRequestHeader("x-cle", key);
  xhr.timeout = 30000;
  function fail(msg) { ag.loading = false; ag.msg = msg; agRender(); }
  xhr.onload = function () {
    if (xhr.status === 401) { store.set(AG_KEY, ""); return fail("Clé refusée par le relais."); }
    if (xhr.status === 404) { return fail("Le relais n'a pas encore la partie Agenda."); }
    var d;
    try { d = JSON.parse(xhr.responseText); } catch (e) { return fail("Réponse illisible du relais."); }
    if (xhr.status !== 200) { return fail("Relais : " + (d.error || "HTTP " + xhr.status)); }
    var w = agWindow(), ev = [], errs = [];
    (d.cals || []).forEach(function (c) {
      if (c.error) { errs.push(agCal(c.id).nom + " : " + c.error); return; }
      try { ev = ev.concat(agParse(c.ics || "", c.id, w[0], w[1])); } catch (e) { errs.push(agCal(c.id).nom + " : illisible"); }
    });
    ev.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
    ag.ev = ev; ag.at = Date.now(); ag.errs = errs; ag.loading = false; ag.msg = "";
    store.set("agendaCache", JSON.stringify({ ev: ev, at: ag.at }));
    agRender();
  };
  xhr.onerror = function () { fail("Pas de connexion."); };
  xhr.ontimeout = function () { fail("Le relais ne répond pas."); };
  xhr.send();
}

/* ---------- Affichage ---------- */
var AG_MO = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function agHM(t) { var d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

function agKeyForm() {
  $("ag-chips").innerHTML = "";
  $("ag-grid").className = "";
  $("ag-grid").innerHTML = '<div class="card ag-key"><div class="ag-kt">Agenda</div>' +
    "<p>Saisis la clé de l'agenda (celle rangée dans le relais Cloudflare). Elle reste mémorisée sur cet appareil.</p>" +
    (ag.msg ? '<p class="status err">' + esc(ag.msg) + "</p>" : "") +
    '<input id="ag-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">' +
    '<button class="chip on" data-save="1">Valider</button></div>';
}

function agRender() {
  if (!store.get(AG_KEY)) { agKeyForm(); return; }
  var views = [["Cette semaine", 0], ["Semaine prochaine", 7], ["Dans 2 semaines", 14]], html = "";
  views.forEach(function (v) { html += '<button class="chip' + (ag.view === v[1] ? " on" : "") + '" data-view="' + v[1] + '">' + v[0] + "</button>"; });
  CONFIG.agenda.forEach(function (c) {
    html += '<button class="chip agc' + (ag.hide[c.id] ? " off" : "") + '" data-cal="' + c.id + '"><i style="background:' + c.couleur + '"></i>' + esc(c.nom) + "</button>";
  });
  var st = ag.loading && !ag.ev ? "Chargement…" : ag.msg || ag.errs.join(" · ");
  html += '<div class="status' + (ag.msg || ag.errs.length ? " err" : "") + '">' + esc(st || (ag.at ? "màj " + agHM(ag.at) : "")) + "</div>";
  html += '<button class="chip agk" data-reset="1" title="Changer la clé">🔑</button>';
  $("ag-chips").innerHTML = html;

  if (!ag.ev) { $("ag-grid").className = ""; $("ag-grid").innerHTML = '<div class="sp-loading">' + esc(ag.msg || "Chargement des agendas…") + "</div>"; return; }
  var now = Date.now(), today = dayStart(new Date()), days = [], i;
  // 1) Événements de chaque jour
  for (i = 0; i < 7; i++) {
    var off = ag.view + i, d0 = new Date(today.getFullYear(), today.getMonth(), today.getDate() + off);
    var a = d0.getTime(), b = new Date(today.getFullYear(), today.getMonth(), today.getDate() + off + 1).getTime();
    var day = { off: off, d: d0, a: a, b: b, all: [], seg: [] };
    ag.ev.forEach(function (e) {
      if (ag.hide[e.c]) { return; }
      if (e.all) { if (e.s < b && Math.max(e.e, e.s + 1) > a) { day.all.push(e); } return; }
      var end = e.e > e.s ? e.e : e.s + 30 * 60e3; // sans durée : 30 min à l'écran
      if (e.s < b && end > a) { day.seg.push({ e: e, s: Math.max(e.s, a), f: Math.min(end, b), h0: (Math.max(e.s, a) - a) / 3600e3, h1: (Math.min(end, b) - a) / 3600e3 }); }
    });
    days.push(day);
  }
  // 2) Plage horaire commune à la semaine (au moins 7 h -> 21 h)
  var H0 = 7, H1 = 21, maxAll = 0;
  days.forEach(function (d) {
    maxAll = Math.max(maxAll, d.all.length);
    d.seg.forEach(function (s) { H0 = Math.min(H0, Math.floor(s.h0)); H1 = Math.max(H1, Math.ceil(s.h1)); });
  });
  var span = H1 - H0;
  function pct(h) { return (Math.max(H0, Math.min(H1, h)) - H0) / span * 100; }
  var allH = maxAll ? maxAll * 2.3 + 0.3 : 0; // rem
  // 3) Colonne des heures
  var out = '<div class="aghrs" style="padding-top:' + (5.9 + allH) + 'rem"><div class="agtl">';
  for (var h = H0; h <= H1; h++) { out += '<span style="top:' + pct(h) + '%">' + h + "h</span>"; }
  out += "</div></div>";
  // 4) Les jours
  days.forEach(function (d) {
    var alls = d.all.map(function (e) {
      return '<div class="agall" style="background:' + agCal(e.c).couleur + '">' + esc(e.t) + "</div>";
    }).join("");
    var lines = "";
    for (var h = H0; h <= H1; h++) { lines += '<i class="agln' + (h % 2 ? "" : " ev") + '" style="top:' + pct(h) + '%"></i>'; }
    // Chevauchements : les rendez-vous simultanés se partagent la largeur
    d.seg.sort(function (x, y) { return x.s - y.s || y.f - x.f; });
    var group = [], cols = [], gEnd = 0, blocks = "";
    function flush() {
      group.forEach(function (s) { s.n = cols.length; });
      group = []; cols = [];
    }
    d.seg.forEach(function (s) {
      if (group.length && s.s >= gEnd) { flush(); }
      var c = 0;
      while (c < cols.length && cols[c] > s.s) { c++; }
      cols[c] = s.f; s.c = c; group.push(s); gEnd = Math.max(gEnd, s.f);
      if (group.length === 1) { gEnd = s.f; }
    });
    flush();
    d.seg.forEach(function (s) {
      var e = s.e, cal = agCal(e.c), top = pct(s.h0), hgt = Math.max(pct(s.h1) - top, 0.1), mins = (s.f - s.s) / 60e3;
      var cls = (s.f <= now ? " past" : s.s <= now && s.f > now ? " now" : "") + (mins < 45 ? " short" : "");
      var hm = e.s < d.a ? "→ " + agHM(e.e) : agHM(e.s) + (e.e > e.s && mins >= 45 ? " – " + (e.e > d.b ? "…" : agHM(e.e)) : "");
      blocks += '<div class="agev' + cls + '" style="top:' + top + "%;height:" + hgt + "%;left:" + (s.c / s.n * 100) + "%;width:" + (100 / s.n) + "%;" +
        "border-left-color:" + cal.couleur + ";background:" + agRGBA(cal.couleur, 0.22) + '">' +
        '<div class="agin"><b style="color:' + cal.couleur + '">' + hm + "</b> " + esc(e.t) +
        (e.l && mins >= 60 && s.n < 3 ? '<span class="agl">' + esc(e.l) + "</span>" : "") + "</div></div>";
    });
    var nowLine = d.off === 0 && now >= d.a && now < d.b ? '<i class="agnow" style="top:' + pct((now - d.a) / 3600e3) + '%"></i>' : "";
    var name = d.off === 0 ? "Aujourd'hui" : d.off === 1 ? "Demain" : JOURS_LONG[d.d.getDay()];
    out += '<div class="card agday' + (d.off === 0 ? " today" : "") + (d.d.getDay() === 0 || d.d.getDay() === 6 ? " we" : "") + '">' +
      '<div class="agd"><b>' + name + "</b><span>" + d.d.getDate() + " " + AG_MO[d.d.getMonth()] + "</span></div>" +
      '<div class="agalls" style="height:' + allH + 'rem">' + alls + "</div>" +
      '<div class="agtl">' + lines + blocks + nowLine + (d.seg.length || d.all.length ? "" : '<div class="agnone">Rien de prévu</div>') + "</div></div>";
  });
  $("ag-grid").className = ag.view === 0 ? "first" : "";
  $("ag-grid").innerHTML = out;
}
function agRGBA(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}

$("page-agenda").addEventListener("click", function (e) {
  var el = e.target;
  while (el && el !== this) {
    var v = el.getAttribute("data-view"), c = el.getAttribute("data-cal");
    if (v !== null) { ag.view = +v; agRender(); return; }
    if (c) { ag.hide[c] = !ag.hide[c]; store.set("agendaHide", JSON.stringify(ag.hide)); agRender(); return; }
    if (el.getAttribute("data-reset")) { store.set(AG_KEY, ""); ag.msg = ""; agRender(); return; }
    if (el.getAttribute("data-save")) {
      var k = ($("ag-in").value || "").replace(/\s+/g, "");
      if (k) { store.set(AG_KEY, k); ag.msg = ""; agRender(); agLoad(); }
      return;
    }
    el = el.parentNode;
  }
});

var agTimer = null;
registerTab("agenda", {
  show: function () {
    agRender();
    if (Date.now() - ag.at > 60e3) { agLoad(); }
    clearInterval(agTimer);
    agTimer = setInterval(function () { if (Date.now() - ag.at > 10 * 60e3) { agLoad(); } else { agRender(); } }, 60e3);
  },
  hide: function () { clearInterval(agTimer); }
});
</script>
<script>startApp();</script>
