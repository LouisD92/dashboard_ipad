}

/* =====================================================================
   MATCHS (ESPN scoreboard)
   ===================================================================== */
function sbURL(sport, slug, dates) { return ESPN + "site/v2/sports/" + sport + "/" + slug + "/scoreboard?dates=" + dates; }

function scoreOf(x) { var s = x.score; if (s && typeof s === "object") { s = s.displayValue; } return s === undefined || s === null ? "" : String(s); }

function normEvent(ev, comp, req) {
  var c = ev.competitions && ev.competitions[0];
  if (!c) { return null; }
  var st = ev.status || c.status || {}, ty = st.type || {};
  var e = { id: ev.id, comp: comp, req: req, t: parseISO(ev.date), state: ty.state, name: ty.name || "",
            detail: ty.shortDetail || "", clock: st.displayClock || "", period: st.period || 0, home: null, away: null, goals: [],
            sit: c.situation || null, week: ev.week && ev.week.number };
  (c.competitors || []).forEach(function (x) {
    var tm = x.team || {};
    var side = { id: tm.id, name: tm.shortDisplayName || tm.displayName || tm.name || "?", abbr: tm.abbreviation || "",
                 logo: tm.logo || (tm.logos && tm.logos[0] && tm.logos[0].href) || "", score: scoreOf(x),
                 win: x.winner === true, rec: x.records && x.records[0] && x.records[0].summary };
    if (x.homeAway === "home") { e.home = side; } else { e.away = side; }
  });
  (c.details || []).forEach(function (d) {
    var a = d.athletesInvolved && d.athletesInvolved[0];
    if (d.scoringPlay && a) {
      e.goals.push({ team: d.team && d.team.id, who: a.shortName || a.displayName,
                     min: d.clock && d.clock.displayValue, og: d.ownGoal, pen: d.penaltyKick });
    }
  });
  return e.t && e.home && e.away ? e : null;
}

// Charge les matchs d'un championnat (avec cache), cb(liste triée par date)
function loadEvents(L, ttl, cb) {
  var comps = L.kind === "europe" ? L.comps : [{ sport: L.sport, slug: L.slug, short: "" }];
  var urls = [], tags = [];
  comps.forEach(function (c) {
    var dates = L.daily ? [ymd(dayStart(new Date(), -1)), ymd(new Date()), ymd(dayStart(new Date(), 1))] : spMonths();
    dates.forEach(function (d, k) { urls.push(sbURL(c.sport, c.slug, d)); tags.push([c, L.daily ? k : null]); });
  });
  spAll(urls, ttl, function (res) {
    var seen = {}, out = [];
    res.forEach(function (d, i) {
      if (!d || !d.events) { return; }
      d.events.forEach(function (ev) {
        if (seen[ev.id]) { return; }
        seen[ev.id] = 1;
        var e = normEvent(ev, tags[i][0], tags[i][1]);
        if (e) {
          e.lid = L.id; e.sport = tags[i][0].sport; e.slug = tags[i][0].slug;
          if (e.sport === "rugby") { rugbyClean(e.home); rugbyClean(e.away); }
          out.push(e);
        }
      });
    });
    out.sort(function (a, b) { return a.t - b.t; });
    sp.events[L.id] = out;
    cb(out);
  });
}

// Regroupe les matchs par journée : numéro de semaine (NFL), numéro de journée (Betclic Élite),
// sinon "chaque équipe ne joue qu'une fois par journée" (foot, rugby, coupes d'Europe)
function spRounds(evs) {
  var now = Date.now(), list = evs.filter(function (e) {
    return !(e.state === "pre" && e.t.getTime() < now - 3 * 3600e3); // match jamais joué/reporté dans le passé : ignoré
  }).sort(function (a, b) { return a.t - b.t; });
  var groups = [], cur = null, lastT = 0;
  list.forEach(function (e) {
    var key = e.week ? "w" + e.week : e.round ? "r" + e.round : null, t = e.t.getTime();
    // Sans numéro : même journée tant qu'aucune des deux équipes n'y a déjà joué (et moins de 4 jours d'écart)
    var same = cur && (key ? cur.key === key : !cur.teams[e.home.id] && !cur.teams[e.away.id] && t - lastT <= 4 * 864e5);
    if (!same && key) { // numéro connu : on rattache au groupe existant de même numéro
      for (var i = 0; i < groups.length; i++) { if (groups[i].key === key) { cur = groups[i]; same = true; break; } }
    }
    if (!same) { cur = { key: key, evs: [], post: 0, pre: 0, live: 0, teams: {} }; groups.push(cur); }
    cur.evs.push(e);
    cur.teams[e.home.id] = cur.teams[e.away.id] = true;
    if (e.state === "post") { cur.post++; } else if (e.state === "in") { cur.live++; } else { cur.pre++; }
    lastT = t;
  });
  groups.forEach(function (g) { g.start = g.evs[0].t.getTime(); });
  groups.sort(function (a, b) { return a.start - b.start; });
  return groups;
}

// Classe les matchs : en direct / récents / à venir
function classify(L, evs) {
  var now = Date.now(), live = [], recent = [], next = [];
  if (L.daily) { // NBA, NHL : nuit dernière (req 0), ce soir (req 1)
    evs.forEach(function (e) {
      if (e.state === "in") { live.push(e); }
      else if (e.req === 0 && e.state === "post") { recent.push(e); }
      else if (e.req === 1) { (e.state === "post" ? recent : next).push(e); }
    });
    recent.reverse();
    return { live: live, recent: recent, next: next };
  }
  // Championnats par journée
  var groups = spRounds(evs), current = null, prev = null, nxt = null;
  groups.forEach(function (g) {
    if (g.live || (g.post && g.pre)) { current = g; }            // journée commencée, pas finie
  });
  if (current) {
    current.evs.forEach(function (e) { (e.state === "in" ? live : e.state === "post" ? recent : next).push(e); });
    recent.sort(function (a, b) { return b.t - a.t; });
    return { live: live, recent: recent, next: next, round: "current" };
  }
  groups.forEach(function (g) {
    if (!g.pre && !g.live && g.post) { prev = g; }               // dernière journée terminée
    if (!nxt && g.pre && !g.post && g.start > now - 3 * 3600e3) { nxt = g; } // prochaine journée
  });
  if (prev) { prev.evs.forEach(function (e) { recent.push(e); }); recent.sort(function (a, b) { return b.t - a.t; }); }
  if (nxt) { nxt.evs.forEach(function (e) { next.push(e); }); }
  return { live: live, recent: recent, next: next, round: "between" };
}

// Titres des sections selon l'état de la journée
function rLab(c, L) { return L.daily ? "Cette nuit" : c.round === "current" ? "Journée en cours · résultats" : "Journée précédente"; }
function nLab(c, L) { return L.daily ? "Ce soir" : c.round === "current" ? "Journée en cours · à venir" : "Prochaine journée"; }

function isFr(side) { return !!sp.frIds[side.id]; }
function isFav(name) {
  for (var i = 0; i < SPORTS.fav.length; i++) { if (name && name.indexOf(SPORTS.fav[i]) >= 0) { return true; } }
  return false;
}
function involvesFr(e) { return isFr(e.home) || isFr(e.away); }

function statusFR(e, us) {
  if (/POSTPONED/.test(e.name)) { return "Reporté"; }
  if (/CANCEL/.test(e.name)) { return "Annulé"; }
  if (e.state === "pre") { return hm(e.t); }
  if (e.state === "in") {
    if (/HALFTIME/.test(e.name)) { return "Mi-t."; }
    if (us) { return e.detail.replace("Halftime", "Mi-t.").replace(/End of /, "Fin ").replace(/(\d)(st|nd|rd|th)/, "$1e"); }
    return e.clock || "Live";
  }
  var d = e.detail;
  if (us) { return /SO/.test(d) ? "Fin tab" : /OT/.test(d) ? "Fin prol." : "Fin"; }
  if (/Pen/i.test(d)) { return "Fin tab"; }
  if (/AET/.test(d)) { return "Fin a.p."; }
  return "Fin";
}

/* ---------- Ligne de match (HTML) ---------- */
function teamHTML(s, side, fr, short) {

}
function matchRow(e, opts) {
  opts = opts || {};

  // Foot : domicile à gauche. Sports US : visiteur à gauche, domicile à droite.
  var L = us ? e.away : e.home, R = us ? e.home : e.away;

    ? '<div class="sc pre">' + (us ? "@" : "–") + "</div>"
    : '<div class="sc"><span class="' + (R.win && !L.win ? "lose" : "") + '">' + L.score + "</span>-<span class=\"" +
      (L.win && !R.win ? "lose" : "") + '">' + R.score + "</span></div>";
  var html = '<div class="m' + (e.state === "in" ? " live" : "") + '"><div class="st">' +
    (opts.badge && e.comp.short ? '<span class="cb">' + e.comp.short + "</span>" : "") + st + "</div>" +
    teamHTML(L, "h", isFr(L), opts.short) + sc + teamHTML(R, "a", isFr(R), opts.short) + "</div>";
  if (opts.goals && e.goals.length && e.state !== "pre") {
    var g = e.goals.map(function (x) {

}
// Liste groupée par jour
function matchList(list, opts) {
  var html = "", lastDay = "";
  list.forEach(function (e) {
    var dl = dayLabel(e.t);
    if (opts && opts.dayHeads && dl !== lastDay) { html += '<div class="sec"><small>' + dl + "</small></div>"; lastDay = dl; }
    html += matchRow(e, opts);
  });
  return html;
}

function loadF1(ttl, cb) {

/* ---------- Panneau LED ---------- */
var TICKER_RESULTS = 4, TICKER_NEXT = 2;   // matchs par championnat dans le bandeau
function tickerName(s, us) { return us ? s.abbr || s.name : s.name; }
function tickerHTML() {
  var parts = [], since = dayStart(new Date(), -1).getTime(), until = dayStart(new Date(), 1).getTime() + 7 * 3600e3;
  LEAGUES.forEach(function (L) {
    var items = [];
    if (L.kind === "f1") {
      var f = sp.f1;
      if (!f) { return; }
      if (f.last && f.last.Results) {
        items.push('<span class="led">' + esc(gpName(f.last.raceName)) + " : " + f.last.Results.slice(0, 3).map(function (r) {
          return r.position + ". <b>" + esc(r.Driver.familyName) + "</b>";
        }).join(" ") + "</span>");
      }
      if (f.drivers.length) {
        items.push('<span class="led">Championnat : <b>' + esc(f.drivers[0].Driver.familyName) + "</b> " + f.drivers[0].points + " pts</span>");
      }
      if (f.next) {
        var nt = f1Date(f.next);
        items.push('<span class="led pre">Prochain : ' + esc(gpName(f.next.raceName)) + " " + shortDay(nt) + " " + hm(nt) + "</span>");
      }
    } else {
      var evs = sp.events[L.id] || [], us = L.kind === "us", sel = [];
      evs.forEach(function (e) {
        var t = e.t.getTime();
        if (L.kind === "europe" && e.comp.slug !== "uefa.champions" && !involvesFr(e)) { return; }
        if (e.state === "in" || (e.state === "post" && t >= since) || (e.state === "pre" && t >= Date.now() - 3600e3 && t < until)) { sel.push(e); }
      });
      if (!sel.length && !L.daily) { sel = classify(L, evs).recent; } // dernière journée
      // L'essentiel seulement : en direct, 5 derniers résultats, 3 prochains matchs (clubs français d'abord)
      var frFirst = function (x, y) { return (involvesFr(y) ? 1 : 0) - (involvesFr(x) ? 1 : 0); };
      var lv = sel.filter(function (e) { return e.state === "in"; });
      var rs = sel.filter(function (e) { return e.state === "post"; }).sort(function (x, y) { return y.t - x.t; });
      var up = sel.filter(function (e) { return e.state === "pre"; });
      if (L.kind === "europe") { lv = stableSort(lv, frFirst); rs = stableSort(rs, frFirst); up = stableSort(up, frFirst); }
      sel = lv.slice(0, 6).concat(rs.slice(0, TICKER_RESULTS), up.slice(0, TICKER_NEXT));
      sel.forEach(function (e) {
        var a = us ? e.away : e.home, b = us ? e.home : e.away;
        var fr = involvesFr(e) ? " fr" : "";
        var cp = L.kind === "europe" ? e.comp.short + " " : "";
        if (e.state === "pre") {
          items.push('<span class="led pre">' + cp + hm(e.t) + " " + esc(tickerName(a, us)) + (us ? " @ " : " - ") + esc(tickerName(b, us)) + "</span>");
        } else {
          items.push('<span class="led' + (e.state === "in" ? " live" : fr) + '">' + (e.state === "in" ? "● " + esc(statusFR(e, us)) + " " : "") + cp +
            esc(tickerName(a, us)) + " <b>" + esc(a.score) + "-" + esc(b.score) + "</b> " + esc(tickerName(b, us)) + "</span>");
        }
      });
    }
    if (items.length) {
      parts.push('<span class="led lg">▶ ' + esc(L.name) + "</span>" + items.join('<span class="led sep">◆</span>'));
    }
  });
  return parts.join('<span class="led sep">✦</span>');
}

function renderTicker() {
  var html = tickerHTML() || '<span class="led">Chargement des scores…</span>';
  if (html === sp.tickerHTML) { return; }
  sp.tickerHTML = html;
  var tr = $("sp-track");
  tr.innerHTML = '<span class="led-run">' + html + '<span class="led sep">✦</span></span><span class="led-run">' + html + '<span class="led sep">✦</span></span>';
  tickerSpeed();

}
function tickerSpeed() {
  var tr = $("sp-track"), run = tr.firstChild;
  if (!run) { return; }
  var dur = Math.max(25, run.offsetWidth / (remPx() * 12)); // ~12 rem par seconde
  tr.style.webkitAnimationDuration = tr.style.animationDuration = dur + "s";
}

function cardHead(L) {
  return '<div class="lc-head">' + leagueIcon(L) + '<div class="lc-title">' + esc(L.name) + '</div><div class="lc-more">Détails ›</div></div>';
}
function homeCard(L) {
  if (L.kind === "f1") { return '<div class="card lcard" data-sp="f1">' + cardHead(L) + '<div class="scroll">' + f1Summary() + "</div></div>"; }
  var evs = sp.events[L.id] || [], us = L.kind === "us", eu = L.kind === "europe";
  if (eu) { // accueil : clubs français + Ligue des champions seulement
    evs = evs.filter(function (e) { return e.comp.slug === "uefa.champions" || involvesFr(e); });
  }
  var c = classify(L, evs);
  if (eu) { // clubs français d'abord
    var byFr = function (a, b) { return (involvesFr(b) ? 1 : 0) - (involvesFr(a) ? 1 : 0); };
    c.live.sort(byFr); c.recent = stableSort(c.recent, byFr); c.next = stableSort(c.next, byFr);
  }
  var o = { us: us, withDay: !L.daily, badge: eu, short: true };
  var html = "";
  if (c.live.length) { html += '<div class="sec live">● En direct</div>' + matchList(c.live, { us: us, badge: eu, short: true }); }
  if (c.recent.length) { html += '<div class="sec">' + rLab(c, L) + "</div>" + matchList(c.recent, o); }
  if (c.next.length) { html += '<div class="sec">' + nLab(c, L) + "</div>" + matchList(c.next, o); }
  if (!html) { html = '<div class="empty-s">Pas de match en ce moment.</div>'; }
  return '<div class="card lcard" data-sp="' + L.id + '">' + cardHead(L) + '<div class="scroll">' + html + "</div></div>";
}
function stableSort(arr, cmp) {

    .map(function (x) { return x[0]; });
}

/* =====================================================================
   CLASSEMENTS (ESPN standings)
   ===================================================================== */
function parseStandings(d) {
  var out = [];
  (function walk(node) {
    if (node.standings && node.standings.entries) {
      out.push({ name: node.name || "", abbr: node.abbreviation || "", entries: node.standings.entries.map(parseEntry) });
    }
    (node.children || []).forEach(walk);
  })(d || {});
  return out;
}
function parseEntry(en) {
  var s = {}, v = {};
  (en.stats || []).forEach(function (x) { s[x.name] = x.value; v[x.name] = x.displayValue; if (x.type) { v[x.type] = x.displayValue; } });
  var t = en.team || {};
  return { team: { id: t.id, name: t.shortDisplayName || t.displayName || t.name, abbr: t.abbreviation,
                   logo: t.logos && t.logos[0] && t.logos[0].href }, note: en.note, s: s, v: v };
}

var ZONES = [
  [/Champions League qual/i, "Barrage Ligue des champions", "#8fe9ff"],
  [/Champions League/i, "Ligue des champions", "#2de2e6"],
  [/Europa League qual/i, "Barrage Ligue Europa", "#ffc38a"],
  [/Europa League/i, "Ligue Europa", "#ff9e4f"],
  [/Conference League/i, "Ligue Conférence", "#ffd166"],
  [/Relegation playoff/i, "Barrage de relégation", "#ff8fc8"],
  [/Relegation/i, "Relégation", "#ff3f6c"],
  [/round of 16/i, "Qualifié pour les 8es", "#2de2e6"],
  [/playoffs - seeded/i, "Barrages (tête de série)", "#a66bff"],
  [/playoffs/i, "Barrages", "#d1b3ff"],
  [/Eliminated/i, "Éliminé", "#ff3f6c"],
  [/Promotion playoff/i, "Barrages de promotion", "#a6f4c5"],
  [/Promotion/i, "Montée directe", "#3ee08f"]
];
function zoneOf(note) {
  if (!note || !note.description) { return null; }
  for (var i = 0; i < ZONES.length; i++) { if (ZONES[i][0].test(note.description)) { return { label: ZONES[i][1], color: ZONES[i][2] }; } }
  return { label: note.description, color: "#b9a3d6" };
}
function legendHTML(zones) {
  var seen = {}, html = "";
  zones.forEach(function (z) { if (z && !seen[z.label]) { seen[z.label] = 1; html += "<span><i style=\"background:" + z.color + "\"></i>" + esc(z.label) + "</span>"; } });
  return html ? '<div class="legend">' + html + "</div>" : "";
}
function teamCell(t) { return '<td class="tn">' + (t.logo ? '<img src="' + t.logo + '" alt="">' : "") + esc(t.name) + "</td>"; }
function rowCls(t) { return (isFav(t.name) ? "fav" : sp.frIds[t.id] ? "fr" : ""); }
function zCell(z) { return '<td class="z">' + (z ? '<i style="background:' + z.color + ";box-shadow:0 0 .5rem " + z.color + '"></i>' : "") + "</td>"; }

/* ---------- Tableau foot ---------- */
// compact : sans les colonnes G / N / P (tableaux étroits)
function soccerTable(entries, tight, compact) {
  var zones = [];
  var html = '<table class="tbl' + (tight ? " tight" : "") + '"><colgroup><col style="width:1.4rem"><col style="width:2.6rem"><col>' +
    '<col style="width:3rem">' + (compact ? "" : '<col style="width:3rem"><col style="width:3rem"><col style="width:3rem">') +
    '<col style="width:4rem"><col style="width:4rem"></colgroup>' +
    "<tr><th></th><th>#</th><th style=\"text-align:left\">Club</th><th>J</th>" + (compact ? "" : "<th>G</th><th>N</th><th>P</th>") + "<th>Diff</th><th>Pts</th></tr>";
  entries.forEach(function (en) {
    var z = zoneOf(en.note);
    zones.push(z);
    html += '<tr class="' + rowCls(en.team) + '">' + zCell(z) + '<td class="rk">' + (en.s.rank || "") + "</td>" + teamCell(en.team) +
      '<td class="mut">' + (en.v.gamesPlayed || 0) + "</td>" +
      (compact ? "" : "<td>" + (en.v.wins || 0) + "</td><td>" + (en.v.ties || 0) + "</td><td>" + (en.v.losses || 0) + "</td>") +
      '<td class="mut">' + (en.v.pointDifferential || 0) + '</td><td class="pts">' + (en.v.points || 0) + "</td></tr>";
  });
  return { html: html + "</table>", zones: zones };
}

/* ---------- Leaders foot ---------- */
function soccerLeaders(d, n) {
  var html = "";
  ((d && d.stats) || []).forEach(function (cat) {
    var title = cat.name === "goalsLeaders" ? "Meilleurs buteurs" : cat.name === "assistsLeaders" ? "Meilleurs passeurs" : cat.displayName;
    html += '<div class="ldr"><div class="sec">' + esc(title) + "</div>";
    (cat.leaders || []).slice(0, n).forEach(function (l, i) {
      var a = l.athlete || {}, t = a.team || {};
      html += '<div class="lrow"><div class="r">' + (i + 1) + '</div><div class="n">' + esc(a.displayName || "") +
        "<small>" + esc(t.abbreviation || t.name || "") + '</small></div><div class="v grad">' + Math.round(l.value) + "</div></div>";
    });
    html += "</div>";
  });
  return html;
}

/* =====================================================================
   VUE DÉTAILLÉE : LIGUE 1 / PREMIER LEAGUE
   ===================================================================== */
function detailSoccer(L) {
  var base = ESPN + "v2/sports/soccer/" + L.slug;
  spAll([base + "/standings", ESPN + "site/v2/sports/soccer/" + L.slug + "/statistics"], 600, function (r) {
    if (sp.view !== L.id) { return; }
    var groups = parseStandings(r[0]), entries = groups[0] ? groups[0].entries.slice() : [];
    entries.sort(function (a, b) { return (a.s.rank || 99) - (b.s.rank || 99); });
    var c = classify(L, sp.events[L.id] || []);

    var col1 = "";
    if (c.live.length) { col1 += '<div class="sec live">● En direct</div>' + matchList(c.live, { goals: true }); }
    col1 += '<div class="sec">' + rLab(c, L) + "</div>" + (c.recent.length ? matchList(c.recent, { goals: true, dayHeads: true }) : '<div class="empty-s">—</div>');
    col1 += '<div class="sec">' + nLab(c, L) + "</div>" + (c.next.length ? matchList(c.next, { dayHeads: true }) : '<div class="empty-s">—</div>');

    var tb = soccerTable(entries, entries.length > 18, false);
    var col3 = soccerLeaders(r[1], 5) + soccerKPIs(entries) + '<div class="sec">Actualités</div><div id="nw-det"></div>';

    $("sp-body").innerHTML = '<div class="dv dv-soccer">' +
      '<div class="card pane"><div class="pane-head"><div class="label">Matchs</div></div><div class="scroll">' + col1 + "</div></div>" +
      '<div class="card pane"><div class="pane-head"><div class="label">Classement ' + esc(L.name) + "</div></div>" + tb.html + legendHTML(tb.zones) + "</div>" +
      '<div class="card pane"><div class="scroll">' + col3 + "</div></div></div>";
    loadNews(L.id, function (list) { var el = $("nw-det"); if (el && sp.view === L.id) { el.innerHTML = newsHTML(list, 3, true); } });
  });
}
function soccerKPIs(entries) {
  if (!entries.length) { return ""; }
  function best(key, dir) {
    var b = entries[0];
    entries.forEach(function (e) { if ((e.s[key] || 0) * dir > (b.s[key] || 0) * dir) { b = e; } });
    return b;
  }
  var goals = 0, games = 0;
  entries.forEach(function (e) { goals += e.s.pointsFor || 0; games += e.s.gamesPlayed || 0; });
  var att = best("pointsFor", 1), def = best("pointsAgainst", -1), worst = best("pointsAgainst", 1), draws = best("ties", 1);
  function k(label, t, v) { return '<div class="kpi">' + label + " <b>" + esc(t) + " · " + v + "</b></div>"; }
  return '<div class="sec">Indicateurs</div>' +
    k("Meilleure attaque", att.team.name, (att.s.pointsFor || 0) + " buts") +
    k("Meilleure défense", def.team.name, (def.s.pointsAgainst || 0) + " encaissés") +
    k("Pire défense", worst.team.name, (worst.s.pointsAgainst || 0) + " encaissés") +
    k("Plus de nuls", draws.team.name, draws.s.ties || 0) +
    '<div class="kpi">Buts par match <b>' + (games ? fr(goals / (games / 2), 2) : "—") + "</b></div>";
}

/* =====================================================================
   VUE DÉTAILLÉE : COUPES D'EUROPE
   ===================================================================== */
function detailEurope(L) {
  var comp = L.comps[sp.euComp] || L.comps[0];
  spAll([ESPN + "v2/sports/soccer/" + comp.slug + "/standings", ESPN + "site/v2/sports/soccer/" + comp.slug + "/statistics"], 600, function (r) {
    if (sp.view !== L.id) { return; }
    var groups = parseStandings(r[0]), entries = [];
    groups.forEach(function (g) { entries = entries.concat(g.entries); });
    entries.sort(function (a, b) { return (a.s.rank || 99) - (b.s.rank || 99); });
    var evs = (sp.events[L.id] || []).filter(function (e) { return e.comp.slug === comp.slug; });
    var c = classify(L, evs);
    var byFr = function (a, b) { return (involvesFr(b) ? 1 : 0) - (involvesFr(a) ? 1 : 0); };

    var seg = '<div class="seg">' + L.comps.map(function (x, i) {
      return '<button data-eu="' + i + '" class="' + (x === comp ? "on" : "") + '">' + x.short + "</button>";
    }).join("") + "</div>";

    // Parcours des clubs français
    var frRows = entries.filter(function (e) { return sp.frIds[e.team.id]; });
    var col1 = "";
    if (frRows.length) {
      col1 += '<div class="sec">Clubs français</div>';
      frRows.forEach(function (e) {
        var z = zoneOf(e.note);
        col1 += '<div class="kpi">' + (e.team.logo ? '<img src="' + e.team.logo + '" style="height:1.8rem;width:1.8rem;vertical-align:middle;margin-right:.5rem" alt="">' : "") +
          '<span style="color:#2de2e6;flex:1">' + esc(e.team.name) + "</span><b>" + (e.s.rank || "?") + "e · " + (e.v.points || 0) + " pts</b>" +
          (z ? '<i style="display:inline-block;width:.9rem;height:.9rem;border-radius:.3rem;margin-left:.6rem;background:' + z.color + '"></i>' : "") + "</div>";
      });
    }
    if (c.live.length) { col1 += '<div class="sec live">● En direct</div>' + matchList(c.live.sort(byFr), { goals: true }); }
    col1 += '<div class="sec">' + rLab(c, L) + "</div>" + (c.recent.length ? matchList(stableSort(c.recent, byFr), { goals: true, withDay: true }) : '<div class="empty-s">—</div>');
    col1 += '<div class="sec">' + nLab(c, L) + "</div>" + (c.next.length ? matchList(stableSort(c.next, byFr), { withDay: true }) : '<div class="empty-s">—</div>');
    col1 += soccerLeaders(r[1], 3);

    var half = Math.ceil(entries.length / 2);
    var t1 = soccerTable(entries.slice(0, half), true, true), t2 = soccerTable(entries.slice(half), true, true);

    $("sp-body").innerHTML = '<div class="dv dv-europe">' +
      '<div class="card pane"><div class="pane-head"><div class="label">' + esc(comp.name) + "</div>" + seg + '</div><div class="scroll">' + col1 + "</div></div>" +
      '<div class="card pane"><div class="pane-head"><div class="label">Phase de ligue</div></div>' + t1.html + "</div>" +
      '<div class="card pane"><div class="pane-head"><div class="label">&nbsp;</div></div>' + t2.html + legendHTML(t1.zones.concat(t2.zones)) + "</div></div>";
  });
}

/* =====================================================================
   VUE DÉTAILLÉE : NFL / NBA / NHL
   ===================================================================== */
var US_NAMES = {
  "Eastern Conference": "Conférence Est", "Western Conference": "Conférence Ouest",
  "American Football Conference": "AFC", "National Football Conference": "NFC",
  "Atlantic Division": "Atlantique", "Metropolitan Division": "Métropolitaine",
  "Central Division": "Centrale", "Pacific Division": "Pacifique",
  "AFC East": "AFC Est", "AFC North": "AFC Nord", "AFC South": "AFC Sud", "AFC West": "AFC Ouest",
  "NFC East": "NFC Est", "NFC North": "NFC Nord", "NFC South": "NFC Sud", "NFC West": "NFC Ouest"
};
function usName(n) { return US_NAMES[n] || n; }

var US_LEADERS = {   // titres courts : une seule ligne dans la bande du bas
  nba: [["pointsPerGame", "Points / m."], ["reboundsPerGame", "Rebonds / m."], ["assistsPerGame", "Passes / m."],
        ["stealsPerGame", "Intercept."], ["blocksPerGame", "Contres"], ["3PointsMadePerGame", "Tirs à 3 pts"]],
  nhl: [["points", "Points"], ["goals", "Buts"], ["assists", "Passes"], ["plusMinus", "+/−"],
        ["savePct", "% d'arrêts"], ["wins", "Vict. gardiens"]],
  nfl: [["passingYards", "Yards passe"], ["rushingYards", "Yards course"], ["receivingYards", "Yards récep."],
        ["totalTouchdowns", "Touchdowns"], ["sacks", "Sacks"], ["interceptions", "Intercept."]]
};
var Z_PLAY = { label: "Playoffs", color: "#2de2e6" };
var Z_DIV = { label: "Vainqueur de division", color: "#2de2e6" };
var Z_WC = { label: "Wild card", color: "#ff9e4f" };
var Z_PLAYIN = { label: "Play-in", color: "#ff9e4f" };
var Z_HNL_DIV = { label: "Top 3 de division", color: "#2de2e6" };

function detailUS(L) {
  var url = ESPN + "v2/sports/" + L.sport + "/" + L.slug + "/standings" + (L.id === "nba" ? "" : "?level=3");
  spAll([url, ESPN + "site/v3/sports/" + L.sport + "/" + L.slug + "/leaders?limit=3"], 900, function (r) {
    if (sp.view !== L.id) { return; }
    var c = classify(L, sp.events[L.id] || []);
    var o = { us: true, withDay: !L.daily };
    var col1 = "";
    if (c.live.length) { col1 += '<div class="sec live">● En direct</div>' + matchList(c.live, { us: true }); }
    col1 += '<div class="sec">' + rLab(c, L) + "</div>" + (c.recent.length ? matchList(c.recent, o) : '<div class="empty-s">—</div>');
    col1 += '<div class="sec">' + (L.daily ? "Ce soir & demain" : nLab(c, L)) + "</div>" + (c.next.length ? matchList(c.next, { us: true, withDay: true }) : '<div class="empty-s">—</div>');
    if (L.daily) { // matchs de demain soir (heure de Paris : la nuit suivante)
      var tm = (sp.events[L.id] || []).filter(function (e) { return e.req === 2 && e.state === "pre"; });
      if (tm.length) { col1 += '<div class="sec">Demain soir</div>' + matchList(tm, { us: true, withDay: true }); }
    }

    var groups = parseStandings(r[0]), tables = [];
    if (L.id === "nba") { tables = nbaTables(groups); }
    else if (L.id === "nhl") { tables = nhlTables(groups); }
    else { tables = nflTables(groups); }

    $("sp-body").innerHTML = '<div class="dv dv-us">' +
      '<div class="card pane matches"><div class="pane-head"><div class="label">Matchs · heure de Paris</div></div><div class="scroll">' + col1 + "</div></div>" +
      '<div class="card pane">' + tables[0] + "</div>" +
      '<div class="card pane">' + tables[1] + "</div>" +
      '<div class="card pane leaders">' + usLeaders(L, r[1]) + "</div></div>";
  });
}

function sortWin(a, b) {
  return (b.s.winPercent || 0) - (a.s.winPercent || 0) || (b.s.wins || 0) - (a.s.wins || 0) || (b.s.pointDifferential || 0) - (a.s.pointDifferential || 0);
}
function badge(z, txt) { return z ? '<span class="sd" style="background:' + z.color + '">' + txt + "</span>" : ""; }

/* NBA : 2 conférences, 1-6 playoffs, 7-10 play-in */
function nbaTables(groups) {
  return groups.slice(0, 2).map(function (g) {
    var en = g.entries.slice().sort(function (a, b) { return (a.s.playoffSeed || 99) - (b.s.playoffSeed || 99); });
    var zones = [];
    var html = '<div class="pane-head"><div class="label">' + esc(usName(g.name)) + "</div></div>" +
      '<table class="tbl tight"><colgroup><col style="width:1.4rem"><col style="width:2.4rem"><col><col style="width:2.8rem"><col style="width:2.8rem">' +
      '<col style="width:4rem"><col style="width:3.2rem"></colgroup>' +
      '<tr><th></th><th>#</th><th style="text-align:left">Équipe</th><th>V</th><th>D</th><th>%</th><th>Éc.</th></tr>';
    en.forEach(function (e, i) {
      var seed = e.s.playoffSeed || i + 1, z = seed <= 6 ? Z_PLAY : seed <= 10 ? Z_PLAYIN : null;
      zones.push(z);
      html += '<tr class="' + rowCls(e.team) + (seed === 7 || seed === 11 ? " cut" : "") + '">' + zCell(z) + '<td class="rk">' + seed + "</td>" + teamCell(e.team) +
        '<td class="pts">' + (e.v.wins || 0) + "</td><td>" + (e.v.losses || 0) + '</td><td class="mut">' + (e.v.winPercent || "") +
        '</td><td class="mut">' + (e.v.gamesBehind || "") + "</td></tr>";
    });
    return html + "</table>" + legendHTML(zones);
  });
}

/* NHL : top 3 de chaque division + 2 wild cards par conférence */
function nhlPts(a, b) {
  return (b.s.points || 0) - (a.s.points || 0) || (a.s.gamesPlayed || 0) - (b.s.gamesPlayed || 0) || (b.s.regWins || 0) - (a.s.regWins || 0);
}
function nhlTables(groups) {
  // groups = divisions ; 2 par conférence, dans l'ordre Est (Atl, Mét), Ouest (Cen, Pac)
  var confs = [groups.slice(0, 2), groups.slice(2, 4)], names = ["Conférence Est", "Conférence Ouest"];
  return confs.map(function (divs, ci) {
    var rest = [], html = '<div class="pane-head"><div class="label">' + names[ci] + "</div></div>" +
      '<table class="tbl tight"><colgroup><col style="width:1.4rem"><col><col style="width:2.8rem"><col style="width:2.6rem"><col style="width:2.6rem">' +
      '<col style="width:2.6rem"><col style="width:3.2rem"><col style="width:3.6rem"></colgroup>' +
      '<tr><th></th><th style="text-align:left">Équipe</th><th>MJ</th><th>V</th><th>D</th><th>DP</th><th>Pts</th><th>Diff</th></tr>';
    function row(e, z, cut) {
      return '<tr class="' + rowCls(e.team) + (cut ? " cut" : "") + '">' + zCell(z) + teamCell(e.team) + '<td class="mut">' + (e.v.gamesPlayed || 0) +
        "</td><td>" + (e.v.wins || 0) + "</td><td>" + (e.v.losses || 0) + "</td><td>" + (e.v.otLosses || e.v.overtimeLosses || 0) +
        '</td><td class="pts">' + (e.v.points || 0) + '</td><td class="mut">' + (e.v.pointDifferential || "") + "</td></tr>";
    }
    divs.forEach(function (d) {
      var en = d.entries.slice().sort(nhlPts);
      html += '<tr class="grp"><td></td><td colspan="7">' + esc(usName(d.name)) + "</td></tr>";
      en.forEach(function (e, i) { if (i < 3) { html += row(e, Z_HNL_DIV); } else { rest.push(e); } });
    });
    rest.sort(nhlPts);
    html += '<tr class="grp"><td></td><td colspan="7">Wild card</td></tr>';
    rest.forEach(function (e, i) { html += row(e, i < 2 ? Z_WC : null, i === 2); });
    return html + "</table>" + legendHTML([Z_HNL_DIV, Z_WC]);
  });
}

/* NFL : 4 divisions par conférence ; têtes de série 1-4 = vainqueurs de division, 5-7 = wild cards */
function nflTables(groups) {
  var confs = [groups.slice(0, 4), groups.slice(4, 8)], names = ["AFC", "NFC"];
  return confs.map(function (divs, ci) {
    var html = '<div class="pane-head"><div class="label">' + names[ci] + "</div></div><div class=\"divs\">";
    divs.forEach(function (d) {
      var en = d.entries.slice().sort(sortWin);
      html += '<table class="tbl tight dt"><colgroup><col style="width:1.4rem"><col><col style="width:3.2rem"><col style="width:2.6rem"><col style="width:2.6rem">' +
        '<col style="width:4rem"><col style="width:3.4rem"></colgroup>' +
        '<tr><th></th><th style="text-align:left;color:#2de2e6">' + esc(usName(d.name)) + "</th><th></th><th>V</th><th>D</th><th>Diff</th><th>Série</th></tr>";
      en.forEach(function (e) {
        var seed = e.s.playoffSeed, z = seed && seed <= 4 ? Z_DIV : seed && seed <= 7 ? Z_WC : null;
        html += '<tr class="' + rowCls(e.team) + '">' + zCell(z) + teamCell(e.team) + "<td>" + badge(z, seed) + '</td><td class="pts">' + (e.v.wins || 0) +
          "</td><td>" + (e.v.losses || 0) + (e.s.ties ? "-" + e.v.ties : "") +
          '</td><td class="mut">' + (e.v.pointDifferential || "") + '</td><td class="mut">' + (e.v.streak || "") + "</td></tr>";
      });
      html += "</table>";
    });
    return html + "</div>" + legendHTML([Z_DIV, Z_WC]);
  });
}

function usLeaders(L, d) {
  var cats = {};
  try { d.leaders.categories.forEach(function (c) { cats[c.name] = c; }); } catch (e) {}
  var html = '<div class="lstrip">';
  US_LEADERS[L.id].forEach(function (k) {
    var c = cats[k[0]];
    html += '<div class="ldr"><div class="sec">' + esc(k[1]) + "</div>";
    ((c && c.leaders) || []).slice(0, 3).forEach(function (l, i) {
      var a = l.athlete || {}, t = l.team || {};
      html += '<div class="lrow">' + (a.headshot && a.headshot.href ? '<img class="hs" src="' + a.headshot.href + '" alt="">' : '<div class="r">' + (i + 1) + "</div>") +
        '<div class="n">' + esc(a.lastName || a.shortName || a.displayName || "") + '</div><div class="v grad">' +
        esc(l.displayValue) + "</div></div>";
    });
    html += "</div>";
  });
  return html + "</div>";
}

/* =====================================================================
   VUE DÉTAILLÉE : FORMULE 1
   ===================================================================== */
function detailF1() {
  var f = sp.f1;
  if (!f) { return; }
  var col1 = "", col2 = "", col3 = "";

  if (f.last) {
    var lt = f1Date(f.last);
    col1 += '<div class="gp-name grad">' + esc(gpName(f.last.raceName)) + '</div><div class="gp-sub">Manche ' + f.last.round + " · " +
      (lt ? dayLabel(lt) : "") + " · " + esc(f.last.Circuit.circuitName) + "</div>";
    (f.last.Results || []).slice(0, 10).forEach(function (r) {
      var gap = r.position === "1" ? (r.Time && r.Time.time) : (r.Time ? r.Time.time : r.status);
      col1 += '<div class="f1r"><div class="p">' + r.position + '</div><div class="c" style="background:' + f1Color(r.Constructor.constructorId) +
        '"></div><div class="n">' + esc(r.Driver.givenName.charAt(0) + ". " + r.Driver.familyName) + "<small>" + esc(r.Constructor.name) +
        '</small></div><div class="g">' + esc(gap || "") + "</div></div>";
    });
  }
  if (f.next) {
    var n = f.next;
    col1 += '<div class="sec" style="margin-top:1.2rem">Prochain Grand Prix</div><div class="gp-name">' + esc(gpName(n.raceName)) + '</div><div class="gp-sub">' +
      esc(n.Circuit.circuitName) + " · " + esc(n.Circuit.Location.locality) + ", " + esc(n.Circuit.Location.country) + "</div>";
    [["FirstPractice", "Essais libres 1"], ["SecondPractice", "Essais libres 2"], ["SprintQualifying", "Qualif. sprint"], ["ThirdPractice", "Essais libres 3"],
     ["Sprint", "Course sprint"], ["Qualifying", "Qualifications"]].forEach(function (k) {
      var t = f1Date(n[k[0]]);
      if (t) { col1 += '<div class="kpi">' + k[1] + " <b>" + shortDay(t) + " " + hm(t) + "</b></div>"; }
    });
    var rt = f1Date(n);
    col1 += '<div class="kpi" style="color:#fff3fb">Course <b class="grad">' + dayLabel(rt) + " " + hm(rt) + "</b></div>";
  }

  var lead = f.drivers.length ? +f.drivers[0].points : 1;
  col2 += '<div class="pane-head"><div class="label">Championnat pilotes · après ' + f.round + " manches</div></div><div class=\"scroll\">";
  f.drivers.forEach(function (d) {
    var team = d.Constructors[0] || {};
    col2 += '<div class="f1r"><div class="p">' + d.position + '</div><div class="c" style="background:' + f1Color(team.constructorId) + '"></div><div class="n">' +
      esc(d.Driver.givenName + " " + d.Driver.familyName) + "<small>" + esc(team.name || "") + " · " + d.wins + " vict.</small></div>" +
      '<div class="bar"><i style="width:' + Math.round(+d.points / Math.max(lead, 1) * 100) + '%"></i></div><div class="pt">' + d.points + "</div></div>";
  });
  col2 += "</div>";

  var tl = f.teams.length ? +f.teams[0].points : 1;
  col3 += '<div class="sec">Championnat constructeurs</div>';
  f.teams.forEach(function (t) {
    col3 += '<div class="f1r"><div class="p">' + t.position + '</div><div class="c" style="background:' + f1Color(t.Constructor.constructorId) + '"></div><div class="n">' +
      esc(t.Constructor.name) + '</div><div class="bar" style="width:4rem"><i style="width:' + Math.round(+t.points / Math.max(tl, 1) * 100) + '%"></i></div><div class="pt">' + t.points + "</div></div>";
  });
  var rest = f.races.filter(function (r) { var t = f1Date(r); return t && t.getTime() > Date.now() - 3 * 3600e3; });
  if (rest.length) {
    col3 += '<div class="sec">Calendrier restant</div>';
    rest.forEach(function (r) {
      var t = f1Date(r);
      col3 += '<div class="kpi">' + esc(gpName(r.raceName)) + " <b>" + t.getDate() + " " + MOIS[t.getMonth()].slice(0, 4) + "</b></div>";
    });
  }

  $("sp-body").innerHTML = '<div class="dv dv-f1">' +
    '<div class="card pane"><div class="pane-head"><div class="label">Dernier Grand Prix</div></div><div class="scroll">' + col1 + "</div></div>" +
    '<div class="card pane">' + col2 + "</div>" +
    '<div class="card pane"><div class="scroll">' + col3 + '<div class="sec">Actualités</div><div id="nw-f1d"></div></div></div></div>';
  loadNews("f1", function (list) { var el = $("nw-f1d"); if (el && sp.view === "f1") { el.innerHTML = newsHTML(list, 3, true); } });
}

/* =====================================================================
   BETCLIC ÉLITE (ex-Jeep Élite) — TheSportsDB, clé de test gratuite "123"
   L'API gratuite ne donne pas le classement : on le calcule à partir des
   résultats de chaque journée. Elle limite aussi le nombre de requêtes :
   file d'attente espacée + journées terminées gardées sur l'iPad.
   ===================================================================== */
var TSDB = "https://www.thesportsdb.com/api/v1/json/123/";
var LNB_ID = 4423;
var lnb = { rounds: {}, last: 0, next: 0, loading: false, n: 0 };

function lnbSeason() {
  var d = new Date(), y = d.getFullYear();
  return d.getMonth() >= 7 ? y + "-" + (y + 1) : (y - 1) + "-" + y;
}

// File d'attente : une requête toutes les ~2 s, et 30 s de pause si l'API dit "trop de requêtes"
var tsdbQ = [], tsdbBusy = false;
function tsdbGet(path, ttlSec, ok, ko) {
  var url = TSDB + path, c = spCache[url];
  if (c && Date.now() - c.t < ttlSec * 1000) { ok(c.d); return; }
  tsdbQ.push({ url: url, ok: ok, ko: ko, c: c, tries: 0 });
  tsdbPump();
}
function tsdbPump() {
  if (tsdbBusy || !tsdbQ.length) { return; }
  tsdbBusy = true;
  var j = tsdbQ.shift();
  function next(ms) { setTimeout(function () { tsdbBusy = false; tsdbPump(); }, ms); }
  getJSON(j.url, function (d) {
    spCache[j.url] = { t: Date.now(), d: d };
    j.ok(d);
    next(2100);
  }, function (err) {
    // Un refus "trop de requêtes" arrive sans autorisation CORS : la page le voit comme "pas de connexion"
    if ((/429|illisible|connexion/.test(err)) && j.tries++ < 3) { tsdbQ.unshift(j); next(30000); return; }
    if (j.c) { j.ok(j.c.d); } else if (j.ko) { j.ko(err); }
    next(2100);
  });
}

// "Chorale Roanne Basket" -> "Roanne"
function lnbShort(n) {
  n = String(n || "?");
  var map = { "Lyon-Villeurbanne": "ASVEL", "Le Mans Sarthe Basket": "Le Mans", "Saint-Quentin Basket-Ball": "Saint-Quentin",
              "Boulogne-Levallois": "Metropolitans 92", "Paris Basketball": "Paris",
              "Élan Béarnais": "Pau", "Boulazac Basket Dordogne": "Boulazac", "Gravelines-Dunkerque": "Gravelines" };
  if (map[n]) { return map[n]; }
  return n.replace(/^(Chorale|Élan|JL|SIG|BCM|JDA|ESSM|CSP|SLUC|ADA)\s+/, "")
          .replace(/\s+(Basket-Ball|Basketball|Basket|Métropole Basket|Sarthe Basket)$/i, "") || n;
}
function lnbAbbr(n) {
  var m = { "Saint-Quentin": "SQB", "Le Mans": "MSB", "ASVEL": "ASV", "Metropolitans 92": "M92", "Paris": "PAR" };
  if (m[n]) { return m[n]; }
  var a = n.normalize ? n.normalize("NFD").replace(/[̀-ͯ]/g, "") : n;
  return a.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
}
function lnbEvent(ev) {
  var hs = ev.intHomeScore, as = ev.intAwayScore, st = ev.strStatus || "";
  var done = /^(FT|AOT|AET)$/i.test(st) || (st === "" && hs !== null && hs !== "" && ev.strPostponed !== "yes" && new Date() - parseISO(ev.strTimestamp) > 3 * 3600e3);
  var live = !done && /^(Q[1-4]|OT|HT|BT|LIVE|1H|2H)$/i.test(st);
  function side(name, id, badge, sc, other) {
    var sh = lnbShort(name);
    return { id: "tsdb" + id, name: sh, abbr: lnbAbbr(sh), logo: badge ? badge + "/tiny" : "", score: sc === null ? "" : String(sc),
             win: done && +sc > +other };
  }
  var e = { id: ev.idEvent, comp: { short: "" }, t: parseISO(ev.strTimestamp || (ev.dateEvent + "T" + (ev.strTime || "18:00:00"))),
            state: done ? "post" : live ? "in" : "pre", name: ev.strPostponed === "yes" ? "STATUS_POSTPONED" : "", detail: /AOT|AET/i.test(st) ? "AET" : "",
            clock: st, round: +ev.intRound, goals: [],
            home: side(ev.strHomeTeam, ev.idHomeTeam, ev.strHomeTeamBadge, hs, as),
            away: side(ev.strAwayTeam, ev.idAwayTeam, ev.strAwayTeamBadge, as, hs) };
  return e.t ? e : null;
}

function loadLNB(cb) {
  if (lnb.loading) { return; }
  lnb.loading = true;
  var season = lnbSeason();
  if (!lnb.table) {
    var any = false;
    for (var k = 1; k <= 60; k++) {
      var sv = store.get("lnb_" + season + "_" + k);
      if (sv) { try { lnb.rounds[k] = JSON.parse(sv); any = k; } catch (e) {} }
    }
    if (any) {
      if (!lnb.last) { lnb.last = any; lnb.next = any + 1; } // en attendant la réponse de l'API
      lnbBuild(); setTimeout(cb, 0);
    }
  }
  tsdbGet("eventspastleague.php?id=" + LNB_ID, 600, function (d) {
    var ev = d && d.events && d.events[0];
    if (ev && ev.strLeagueBadge) { leagueById("lnb").logo = ev.strLeagueBadge + "/tiny"; }
    lnb.last = ev ? +ev.intRound : 0;
    tsdbGet("eventsnextleague.php?id=" + LNB_ID, 600, function (d2) {
      var nx = d2 && d2.events && d2.events[0];
      lnb.next = nx ? +nx.intRound : lnb.last + 1;
      var maxR = Math.max(lnb.last, lnb.next), todo = [];
      for (var r = 1; r <= maxR; r++) {
        var saved = store.get("lnb_" + season + "_" + r);
        if (saved && r < lnb.last) { try { lnb.rounds[r] = JSON.parse(saved); continue; } catch (e) {} }
        todo.push(r);
      }
      var left = todo.length;
      function finish() { lnbBuild(); lnb.loading = false; cb(); }
      if (!left) { finish(); return; }
      // Les journées les plus récentes d'abord : l'accueil peut s'afficher vite
      todo.reverse().forEach(function (r) {
        var recent = r >= lnb.last;
        tsdbGet("eventsround.php?id=" + LNB_ID + "&r=" + r + "&s=" + season, recent ? 300 : 6 * 3600, function (d3) {
          var list = (d3 && d3.events) || [];
          lnb.rounds[r] = list;
          var allDone = list.length && list.every(function (x) { return /^(FT|AOT|AET)$/i.test(x.strStatus || ""); });
          if (allDone) { store.set("lnb_" + season + "_" + r, JSON.stringify(list)); }
          if (--left === 0) { finish(); } else if (r === lnb.last) { lnbBuild(); cb(); }
        }, function () { if (--left === 0) { finish(); } });
      });
    }, function () { lnb.loading = false; });
  }, function () { lnb.loading = false; });
}

// Matchs normalisés + classement calculé
function lnbBuild() {
  var evs = [], seen = {};
  for (var r in lnb.rounds) {
    (lnb.rounds[r] || []).forEach(function (x) {
      if (seen[x.idEvent]) { return; }
      seen[x.idEvent] = 1;
      var e = lnbEvent(x);
      if (e) { evs.push(e); }
    });
  }
  evs.sort(function (a, b) { return a.t - b.t; });
  sp.events.lnb = evs;

  var T = {};
  function team(s) { return T[s.id] || (T[s.id] = { team: { id: s.id, name: s.name, logo: s.logo }, gp: 0, w: 0, l: 0, pf: 0, pa: 0, form: [], hw: 0, hl: 0, aw: 0, al: 0 }); }
  evs.forEach(function (e) {
    var h = team(e.home), a = team(e.away);
    if (e.state !== "post" || e.home.score === "" || e.away.score === "") { return; }
    var hs = +e.home.score, as = +e.away.score, hw = hs > as;
    h.gp++; a.gp++; h.pf += hs; h.pa += as; a.pf += as; a.pa += hs;
    if (hw) { h.w++; a.l++; h.hw++; a.al++; } else { a.w++; h.l++; a.aw++; h.hl++; }
    h.form.push(hw ? "V" : "D"); a.form.push(hw ? "D" : "V");
  });
  var rows = Object.keys(T).map(function (k) { return T[k]; });
  rows.sort(function (x, y) {
    var px = x.gp ? x.w / x.gp : 0, py = y.gp ? y.w / y.gp : 0;
    return py - px || y.w - x.w || (y.pf - y.pa) - (x.pf - x.pa);
  });
  rows.forEach(function (t, i) { t.rank = i + 1; });
  lnb.table = rows;
  lnb.n = rows.length;
}

var Z_LNB_PO = { label: "Playoffs (top 8)", color: "#2de2e6" };
var Z_LNB_REL = { label: "Relégation", color: "#ff3f6c" };

function detailLNB() {
  var L = leagueById("lnb"), evs = sp.events.lnb;
  if (!evs || !lnb.table) {
    $("sp-body").innerHTML = '<div class="sp-loading">Chargement de la Betclic Élite… (la première fois, cela peut prendre une trentaine de secondes : l\'accès gratuit impose d\'espacer les requêtes)</div>';
    return;
  }
  var lastR = evs.filter(function (e) { return e.round === lnb.last; });
  var nextR = evs.filter(function (e) { return e.round === lnb.next && e.state !== "post"; });
  var live = evs.filter(function (e) { return e.state === "in"; });

  var col1 = "";
  if (live.length) { col1 += '<div class="sec live">● En direct</div>' + matchList(live, {}); }
  col1 += '<div class="sec">Journée ' + lnb.last + "</div>" + (lastR.length ? matchList(lastR, { dayHeads: true }) : '<div class="empty-s">—</div>');
  if (lnb.next && lnb.next !== lnb.last) {
    col1 += '<div class="sec">Journée ' + lnb.next + "</div>" + (nextR.length ? matchList(nextR, { dayHeads: true }) : '<div class="empty-s">—</div>');
  }

  // Classement
  var n = lnb.table.length, zones = [];
  var html = '<table class="tbl"><colgroup><col style="width:1.4rem"><col style="width:2.6rem"><col><col style="width:2.8rem"><col style="width:2.8rem">' +
    '<col style="width:2.8rem"><col style="width:4rem"><col style="width:6.6rem"></colgroup>' +
    '<tr><th></th><th>#</th><th style="text-align:left">Équipe</th><th>J</th><th>V</th><th>D</th><th>Diff</th><th>Forme</th></tr>';
  lnb.table.forEach(function (t) {
    var z = t.rank <= 8 ? Z_LNB_PO : t.rank > n - 2 ? Z_LNB_REL : null;
    zones.push(z);
    var diff = t.pf - t.pa;
    var form = t.form.slice(-5).map(function (f) {
      return '<i style="display:inline-block;width:.9rem;height:.9rem;border-radius:50%;margin:0 .1rem;background:' + (f === "V" ? "#3ee08f" : "#ff3f6c") + '"></i>';
    }).join("");
    html += '<tr class="' + rowCls(t.team) + (t.rank === 9 || t.rank === n - 1 ? " cut" : "") + '">' + zCell(z) + '<td class="rk">' + t.rank + "</td>" + teamCell(t.team) +
      '<td class="mut">' + t.gp + '</td><td class="pts">' + t.w + "</td><td>" + t.l +
      '</td><td class="mut">' + (diff > 0 ? "+" : "") + diff + "</td><td>" + form + "</td></tr>";
  });
  html += "</table>" + legendHTML([Z_LNB_PO, Z_LNB_REL]) +
    '<div class="legend"><span>Classement calculé d\'après les résultats (% de victoires, puis différence de points).</span></div>';

  $("sp-body").innerHTML = '<div class="dv dv-soccer">' +
    '<div class="card pane"><div class="pane-head"><div class="label">Matchs</div></div><div class="scroll">' + col1 + "</div></div>" +
    '<div class="card pane"><div class="pane-head"><div class="label">Classement ' + esc(L.name) + "</div></div>" + html + "</div>" +
    '<div class="card pane"><div class="scroll">' + lnbKPIs(evs) + "</div></div></div>";
}

function lnbKPIs(evs) {
  var t = lnb.table.filter(function (x) { return x.gp; });
  if (!t.length) { return ""; }
  function best(fn) { var b = t[0]; t.forEach(function (x) { if (fn(x) > fn(b)) { b = x; } }); return b; }
  var att = best(function (x) { return x.pf / x.gp; }), def = best(function (x) { return -x.pa / x.gp; });
  var home = best(function (x) { return x.hw - x.hl; }), away = best(function (x) { return x.aw - x.al; });
  // Série de victoires en cours la plus longue
  var streakT = null, streak = 0;
  t.forEach(function (x) { var k = 0; for (var i = x.form.length - 1; i >= 0 && x.form[i] === "V"; i--) { k++; } if (k > streak) { streak = k; streakT = x; } });
  var big = null, tot = 0, games = 0, ot = 0;
  evs.forEach(function (e) {
    if (e.state !== "post" || e.home.score === "") { return; }
    var d = Math.abs(+e.home.score - +e.away.score);
    tot += +e.home.score + +e.away.score; games++;
    if (e.detail === "AET") { ot++; }
    if (!big || d > big.d) { big = { d: d, e: e }; }
  });
  function k(label, who, v) { return '<div class="kpi">' + label + " <b>" + esc(who) + " · " + v + "</b></div>"; }
  var html = '<div class="sec">Indicateurs</div>' +
    k("Meilleure attaque", att.team.name, fr(att.pf / att.gp, 1) + " pts/m") +
    k("Meilleure défense", def.team.name, fr(def.pa / def.gp, 1) + " pts/m") +
    (streakT ? k("Série en cours", streakT.team.name, streak + " vict.") : "") +
    k("Meilleur à domicile", home.team.name, home.hw + "-" + home.hl) +
    k("Meilleur à l'extérieur", away.team.name, away.aw + "-" + away.al) +
    '<div class="kpi">Points par match <b>' + (games ? fr(tot / games, 1) : "—") + "</b></div>" +
    '<div class="kpi">Matchs joués <b>' + games + (ot ? " · " + ot + " prol." : "") + "</b></div>";
  if (big) {
    html += '<div class="sec">Plus large victoire</div>' + matchRow(big.e, { withDay: true });
  }
  html += '<div class="sec">Source</div><div class="empty-s">Résultats : TheSportsDB (accès gratuit). Pas de statistiques individuelles (meilleurs marqueurs) dans l\'accès gratuit.</div>';
  return html;
}

/* =====================================================================
   VUE DÉTAILLÉE : TOP 14 (rugby, ESPN)
   1-2 : demi-finales directes · 3-6 : barrages · 13 : access match · 14 : relégation
   ===================================================================== */
// Noms et sigles d'usage des clubs de Top 14 (ceux d'ESPN sont incohérents)
var RUGBY_CLUBS = {
  "Montpellier Herault": ["Montpellier", "MHR"], "Castres Olympique": ["Castres", "CO"], "Pau": ["Pau", "PAU"], "Section Paloise": ["Pau", "PAU"],
  "Stade Toulousain": ["Toulouse", "ST"], "Clermont Auvergne": ["Clermont", "ASM"], "Perpignan": ["Perpignan", "USAP", "https://r2.thesportsdb.com/images/media/team/badge/9jsg3o1573137449.png/tiny"], "Racing 92": ["Racing 92", "R92"],
  "Lyon": ["Lyon", "LOU"], "Toulon": ["Toulon", "RCT"], "Stade Francais Paris": ["Stade Français", "SF"], "Vannes": ["Vannes", "RCV", "https://upload.wikimedia.org/wikipedia/fr/thumb/7/74/Logo_RC_Vannes_-_2022.svg/120px-Logo_RC_Vannes_-_2022.svg.png"],
  "Bordeaux Begles": ["Bordeaux-Bègles", "UBB"], "La Rochelle": ["La Rochelle", "SR"], "Bayonne": ["Bayonne", "AB", "https://r2.thesportsdb.com/images/media/team/badge/z0fq591714808782.png/tiny"], "Montauban": ["Montauban", "USM"],
  "Grenoble": ["Grenoble", "FCG"], "Oyonnax": ["Oyonnax", "USO"], "Brive": ["Brive", "CAB"], "Agen": ["Agen", "SUA"]
};
// 3e valeur : logo de remplacement (ESPN donne le drapeau des États-Unis pour Perpignan, celui du Vanuatu pour Vannes, rien pour Bayonne)
function rugbyClean(side) { var m = RUGBY_CLUBS[side.name]; if (m) { side.name = m[0]; side.abbr = m[1]; if (m[2]) { side.logo = m[2]; } } return side; }

var Z_R_DEMI = { label: "Demi-finale directe", color: "#2de2e6" };
var Z_R_BARR = { label: "Barrages", color: "#a66bff" };
var Z_R_ACCESS = { label: "Access match", color: "#ff8fc8" };
var Z_R_REL = { label: "Relégation", color: "#ff3f6c" };
function rugbySeason() { var d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() + 1 : d.getFullYear(); }

function detailRugby(L) {
  spAll([ESPN + "v2/sports/rugby/" + L.slug + "/standings?season=" + rugbySeason()], 600, function (r) {
    if (sp.view !== L.id) { return; }
    var groups = parseStandings(r[0]), entries = groups[0] ? groups[0].entries.slice() : [];
    entries.forEach(function (e) { rugbyClean(e.team); });
    entries.sort(function (a, b) { return (b.s.points || 0) - (a.s.points || 0) || (b.s.pointsDifference || 0) - (a.s.pointsDifference || 0); });
    var n = entries.length, c = classify(L, sp.events[L.id] || []);

    var col1 = "";
    if (c.live.length) { col1 += '<div class="sec live">● En direct</div>' + matchList(c.live, {}); }
    col1 += '<div class="sec">' + rLab(c, L) + "</div>" + (c.recent.length ? matchList(c.recent, { dayHeads: true }) : '<div class="empty-s">—</div>');
    col1 += '<div class="sec">' + nLab(c, L) + "</div>" + (c.next.length ? matchList(c.next, { dayHeads: true }) : '<div class="empty-s">—</div>');

    var zones = [];
    var html = '<table class="tbl"><colgroup><col style="width:1.4rem"><col style="width:2.6rem"><col><col style="width:2.8rem"><col style="width:2.8rem">' +
      '<col style="width:2.8rem"><col style="width:2.8rem"><col style="width:4.2rem"><col style="width:3rem"><col style="width:3.8rem"></colgroup>' +
      '<tr><th></th><th>#</th><th style="text-align:left">Club</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th><th>Bon.</th><th>Pts</th></tr>';
    entries.forEach(function (e, i) {
      var rk = i + 1, z = rk <= 2 ? Z_R_DEMI : rk <= 6 ? Z_R_BARR : rk === n - 1 ? Z_R_ACCESS : rk === n ? Z_R_REL : null;
      zones.push(z);
      html += '<tr class="' + (isFav(e.team.name) ? "fav" : "") + (rk === 7 || rk === n - 1 ? " cut" : "") + '">' + zCell(z) + '<td class="rk">' + rk + "</td>" + teamCell(e.team) +
        '<td class="mut">' + (e.v.gamesPlayed || 0) + "</td><td>" + (e.v.gamesWon || 0) + "</td><td>" + (e.v.gamesDrawn || 0) + "</td><td>" + (e.v.gamesLost || 0) +
        '</td><td class="mut">' + (e.v.pointsDifference || 0) + '</td><td class="mut">' + (e.v.bonusPoints || 0) + '</td><td class="pts">' + (e.v.points || 0) + "</td></tr>";
    });
    html += "</table>" + legendHTML([Z_R_DEMI, Z_R_BARR, Z_R_ACCESS, Z_R_REL]);

    var kp = "";
    if (entries.length) {
      var best = function (k, dir) { var b = entries[0]; entries.forEach(function (e) { if ((e.s[k] || 0) * dir > (b.s[k] || 0) * dir) { b = e; } }); return b; };
      var att = best("pointsFor", 1), def = best("pointsAgainst", -1), bon = best("bonusPoints", 1);
      var k = function (label, t, v) { return '<div class="kpi">' + label + " <b>" + esc(t) + " · " + v + "</b></div>"; };
      kp = '<div class="sec">Indicateurs</div>' +
        k("Meilleure attaque", att.team.name, (att.s.pointsFor || 0) + " pts") +
        k("Meilleure défense", def.team.name, (def.s.pointsAgainst || 0) + " encaissés") +
        k("Plus de bonus", bon.team.name, bon.s.bonusPoints || 0) +
        k("Meilleure moyenne", best("avgPointsFor", 1).team.name, fr(best("avgPointsFor", 1).s.avgPointsFor || 0, 1) + " pts/m");
    }
    $("sp-body").innerHTML = '<div class="dv dv-soccer">' +
      '<div class="card pane"><div class="pane-head"><div class="label">Matchs</div></div><div class="scroll">' + col1 + "</div></div>" +

<script>
/* =====================================================================
   ONGLET DIRECT — suivre les matchs en cours, sport par sport
   NFL / NBA / NHL / foot / rugby : ESPN (scoreboard + résumé du match)
   F1 : OpenF1 (positions, écarts, pneus, arrêts, dépassements, direction de course)
   ===================================================================== */
var DIRECT_SPORTS = [
  { id: "nfl", name: "NFL", leagues: ["nfl"], logo: "https://a.espncdn.com/i/teamlogos/leagues/500-dark/nfl.png" },
  { id: "nba", name: "NBA", leagues: ["nba"], logo: "https://a.espncdn.com/i/teamlogos/leagues/500-dark/nba.png" },
  { id: "nhl", name: "NHL", leagues: ["nhl"], logo: "https://a.espncdn.com/i/teamlogos/leagues/500-dark/nhl.png" },
  { id: "foot", name: "Foot", leagues: ["l1", "pl", "champ", "eu"], emoji: "⚽️" },
  { id: "rugby", name: "Rugby", leagues: ["top14"], emoji: "🏉" },
  { id: "f1", name: "F1", f1: true, logo: "https://a.espncdn.com/i/teamlogos/leagues/500-dark/f1.png" }
];
var dx = { sport: store.get("dxSport") || "nfl", sel: null, timer: null, detailTimer: null, evs: [] };
function dxSport() { for (var i = 0; i < DIRECT_SPORTS.length; i++) { if (DIRECT_SPORTS[i].id === dx.sport) { return DIRECT_SPORTS[i]; } } return DIRECT_SPORTS[0]; }

/* ---------- Petites traductions ---------- */
function frDown(s) { // "3rd & 4 at KC 18" -> "3e & 4 · KC 18"
  return String(s || "").replace(/(\d)(st|nd|rd|th)\b/g, function (m, n) { return n === "1" ? "1re" : n + "e"; }).replace(/ at /, " · ");
}
function frPeriod(e) {
  if (e.state !== "in") { return statusFR(e, e.sport !== "soccer" && e.sport !== "rugby"); }
  if (e.sport === "soccer" || e.sport === "rugby") { return /HALFTIME/.test(e.name) ? "Mi-temps" : e.clock; }
  if (/HALFTIME/.test(e.name)) { return "Mi-temps"; }
  var p = e.period, lab = e.sport === "hockey" ? (p > 3 ? "Prol." : p + "e pér.") : (p > 4 ? "Prol." : "QT" + p);
  if (/END_PERIOD/.test(e.name)) { return "Fin " + lab; }
  return lab + " · " + e.clock;
}

/* =====================================================================
   NAVIGATION + LISTE DES MATCHS
   ===================================================================== */
function dxChips() {
  var html = "";
  DIRECT_SPORTS.forEach(function (S) {
    var live = S.f1 ? 0 : dxLiveCount(S);
    html += '<button class="chip' + (S.id === dx.sport ? " on" : "") + '" data-dx="' + S.id + '">' +
      (S.emoji ? '<span class="emo">' + S.emoji + "</span>" : '<img src="' + S.logo + '" alt="">') + S.name +
      (live ? ' <span class="livepill">' + live + "</span>" : "") + "</button>";
  });
  html += '<div class="status" id="dx-status"></div>';
  $("dx-chips").innerHTML = html;
}
function dxLiveCount(S) {
  var n = 0;
  S.leagues.forEach(function (id) { (sp.events[id] || []).forEach(function (e) { if (e.state === "in") { n++; } }); });
  return n;
}

// Matchs à afficher : en cours, puis ceux d'aujourd'hui (jusqu'à 8 h demain), puis les terminés du jour
function dxGames(S) {
  var from = dayStart(new Date()).getTime() - 2 * 3600e3, to = dayStart(new Date(), 1).getTime() + 8 * 3600e3, all = [];
  S.leagues.forEach(function (id) { all = all.concat(sp.events[id] || []); });
  var live = [], next = [], done = [];
  all.forEach(function (e) {
    var t = e.t.getTime();
    if (e.state === "in") { live.push(e); }
    else if (t >= from && t <= to) { (e.state === "pre" ? next : done).push(e); }
  });
  live.sort(function (a, b) { return (b.sit && b.sit.isRedZone ? 1 : 0) - (a.sit && a.sit.isRedZone ? 1 : 0) || a.t - b.t; });
  next.sort(function (a, b) { return a.t - b.t; });
  done.sort(function (a, b) { return b.t - a.t; });
  return { live: live, next: next, done: done };
}

function dxLoad(cb) {
  var S = dxSport();
  if (S.f1) { cb(); return; }
  var left = S.leagues.length;
  if (S.id === "foot") { left++; loadFrIds(function () { if (--left === 0) { cb(); } }); }
  S.leagues.forEach(function (id) { loadEvents(leagueById(id), 15, function () { if (--left === 0) { cb(); } }); });
}

function dxRefresh() {
  var S = dxSport();

  if (S.f1) { f1Live(); return; }

    if (dxSport() !== S) { return; }
    dxChips();
    dxRenderList(S);
    var t = new Date();
    $("dx-status").textContent = "Màj " + pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());
  });
}

function dxRenderList(S) {
  var g = dxGames(S), html = "";
  var us = S.id === "nfl" || S.id === "nba" || S.id === "nhl";
  function tiles(list) { return '<div class="tiles">' + list.map(function (e) { return dxTile(e, us); }).join("") + "</div>"; }
  if (g.live.length) { html += '<div class="sec live">● En direct · ' + g.live.length + "</div>" + tiles(g.live); }
  if (g.next.length) { html += '<div class="sec">À venir aujourd\'hui</div>' + tiles(g.next); }
  if (g.done.length) { html += '<div class="sec">Terminés</div>' + tiles(g.done); }
  if (!html) {
    // Rien aujourd'hui : prochains matchs
    var up = [];
    S.leagues.forEach(function (id) { up = up.concat((sp.events[id] || []).filter(function (e) { return e.state === "pre"; })); });
    up.sort(function (a, b) { return a.t - b.t; });

  }
  var keep = $("dx-list").scrollTop;
  $("dx-list").innerHTML = html;
  $("dx-list").scrollTop = keep;

  // Match affiché à droite : celui choisi, sinon le premier en direct (en red zone d'abord), sinon le premier
  var all = g.live.concat(g.next, g.done);
  var cur = null;
  all.forEach(function (e) { if (e.id === dx.sel) { cur = e; } });
  if (!cur) { cur = all[0] || null; }
  if (cur) {
    var tl = $("dx-list").querySelector('[data-ev="' + cur.id + '"]');
    if (tl) { tl.className += " sel"; }
    dxDetail(cur);
  } else {
    $("dx-detail").innerHTML = '<div class="empty-s" style="padding:2rem">Aucun match à suivre.</div>';
  }
}

function dxTile(e, us) {
  var A = us ? e.away : e.home, B = us ? e.home : e.away, sit = e.sit, rz = e.state === "in" && sit && sit.isRedZone;
  var L = leagueById(e.lid) || {};
  function line(s) {
    var poss = e.state === "in" && sit && sit.possession && sit.possession === s.id;
    return '<div class="tl"><img src="' + s.logo + '" alt=""><span class="tn2' + (isFr(s) ? " fr" : "") + '">' + esc(s.name) + "</span>" +
      (poss ? '<span class="ball">🏈</span>' : "") +
      '<span class="ts' + (e.state === "post" && !s.win && (A.win || B.win) ? " lose" : "") + '">' + (e.state === "pre" ? "" : esc(s.score)) + "</span></div>";

  var extra = "";
  if (e.state === "in" && sit) {

    if (sit.lastPlay && sit.lastPlay.text) { extra += '<div class="lp">' + esc(sit.lastPlay.text) + "</div>"; }

/* =====================================================================
   DÉTAIL D'UN MATCH (résumé ESPN)
   ===================================================================== */
var DX_STATS = {
  football: [["totalYards", "Yards totaux"], ["netPassingYards", "Yards à la passe"], ["rushingYards", "Yards à la course"],
             ["firstDowns", "1ers downs"], ["thirdDownEff", "3e tentatives"], ["redZoneAttempts", "Red zone (réussies)"],
             ["turnovers", "Pertes de balle"], ["sacksYardsLost", "Sacks subis"], ["totalPenaltiesYards", "Pénalités"], ["possessionTime", "Possession"]],
  basketball: [["fieldGoalPct", "Tirs %"], ["threePointFieldGoalPct", "3 pts %"], ["freeThrowPct", "Lancers francs %"],
               ["totalRebounds", "Rebonds"], ["assists", "Passes déc."], ["steals", "Interceptions"], ["blocks", "Contres"], ["turnovers", "Balles perdues"]],
  hockey: [["shotsTotal", "Tirs"], ["powerPlayGoals", "Buts en supériorité"], ["powerPlayOpportunities", "Supériorités"],
           ["faceoffPercent", "Mises en jeu %"], ["hits", "Mises en échec"], ["blockedShots", "Tirs bloqués"], ["giveaways", "Revirements"], ["penaltyMinutes", "Min. de pénalité"]],
  soccer: [["possessionPct", "Possession %"], ["totalShots", "Tirs"], ["shotsOnTarget", "Tirs cadrés"], ["wonCorners", "Corners"],
           ["foulsCommitted", "Fautes"], ["yellowCards", "Cartons jaunes"], ["redCards", "Cartons rouges"], ["offsides", "Hors-jeu"], ["accuratePasses", "Passes réussies"]]
};

function dxDetail(e) {
  var old = $("dx-sum");
  dx.sumScroll = old && dx.cur && dx.cur.id === e.id ? old.scrollTop : 0;
  dx.cur = e;
  var us = e.sport !== "soccer" && e.sport !== "rugby", A = us ? e.away : e.home, B = us ? e.home : e.away;
  var head = '<div class="dh"><div class="dteam"><img src="' + A.logo + '" alt=""><div>' + esc(A.name) + "</div></div>" +
    '<div class="dscore"><div class="big grad">' + (e.state === "pre" ? hm(e.t) : esc(A.score) + " – " + esc(B.score)) + "</div>" +
    '<div class="dclk' + (e.state === "in" ? " on" : "") + '">' + (e.state === "in" ? "● " : "") + esc(e.state === "pre" ? dayLabel(e.t) : frPeriod(e)) + "</div></div>" +
    '<div class="dteam"><img src="' + B.logo + '" alt=""><div>' + esc(B.name) + "</div></div></div>";
  var sitHTML = "";
  if (e.state === "in" && e.sit && e.sit.downDistanceText) {
    var poss = e.sit.possession === e.home.id ? e.home : e.sit.possession === e.away.id ? e.away : null;
    sitHTML = '<div class="nflsit' + (e.sit.isRedZone ? " redzone" : "") + '">' + (e.sit.isRedZone ? '<span class="rz">RED ZONE</span>' : "") +
      (poss ? "🏈 <b>" + esc(poss.name) + "</b> · " : "") + esc(frDown(e.sit.downDistanceText)) + "</div>";
  }
  $("dx-detail").innerHTML = head + sitHTML + '<div id="dx-sum" class="scroll"><div class="empty-s">Chargement des statistiques…</div></div>';
  if (e.sport === "rugby" || e.state === "pre") { dxNoSummary(e); return; }
  var url = ESPN + "site/v2/sports/" + e.sport + "/" + e.slug + "/summary?event=" + e.id;
  spGet(url, e.state === "in" ? 15 : 300, function (d) { if (dx.cur && dx.cur.id === e.id) { dxSummary(e, d, us); } },
    function () { $("dx-sum").innerHTML = '<div class="empty-s">Statistiques indisponibles.</div>'; });
}

function dxNoSummary(e) {
  var html = "";
  if (e.goals.length) { html += '<div class="sec">Marqueurs</div><div class="goals" style="padding-left:0">' + e.goals.map(function (g) { return esc(g.who) + " " + (g.min || ""); }).join(" · ") + "</div>"; }
  if (e.state === "pre") { html += '<div class="empty-s">Le match n\'a pas commencé : les statistiques apparaîtront au coup d\'envoi.</div>'; }
  else if (e.sport === "rugby") { html += '<div class="empty-s">Pour le rugby, ESPN ne fournit que le score et le temps de jeu.</div>'; }
  $("dx-sum").innerHTML = html;
}

function dxSummary(e, d, us) {
  var A = us ? e.away : e.home, B = us ? e.home : e.away, html = "";
  // Probabilité de victoire (NFL, NBA)
  var wp = d.winprobability && d.winprobability[d.winprobability.length - 1];
  if (wp && e.state !== "post") {
    var hp = Math.round(wp.homeWinPercentage * 100), ap = 100 - hp, pa = us ? ap : hp;
    html += '<div class="sec">Probabilité de victoire</div><div class="wp"><span>' + esc(A.abbr || A.name) + " " + pa + '%</span><div class="wpbar"><i style="width:' + pa +
      '%"></i></div><span>' + (100 - pa) + "% " + esc(B.abbr || B.name) + "</span></div>";
  }
  // NFL : série en cours + actions
  if (e.sport === "football" && d.drives) {
    var dr = d.drives.current || (d.drives.previous && d.drives.previous[d.drives.previous.length - 1]);
    if (dr) {
      html += '<div class="sec">' + (d.drives.current ? "Série en cours" : "Dernière série") + " · " + esc((dr.team && dr.team.abbreviation) || "") + "</div>" +
        '<div class="kpi">' + esc(dr.description || "") + " <b>" + esc(dr.displayResult || "En cours") + "</b></div>";
      (dr.plays || []).slice(-4).reverse().forEach(function (p) {
        html += '<div class="play"><b>' + esc(frDown((p.start && p.start.downDistanceText) || "")) + "</b> " + esc(p.text || "") + "</div>";
      });
    }
  }
  // NBA / NHL : dernières actions
  if ((e.sport === "basketball" || e.sport === "hockey") && d.plays && d.plays.length) {
    html += '<div class="sec">Dernières actions</div>';
    d.plays.slice(-5).reverse().forEach(function (p) {
      html += '<div class="play"><b>' + esc((p.period && p.period.number ? (e.sport === "hockey" ? p.period.number + "e" : "QT" + p.period.number) : "") + " " + ((p.clock && p.clock.displayValue) || "")) + "</b> " + esc(p.text || "") + "</div>";
    });
  }
  // Foot : temps forts
  if (e.sport === "soccer" && d.keyEvents) {
    var ke = d.keyEvents.filter(function (k) { return /Goal|Card|Penalty|Substitution/i.test((k.type && k.type.text) || "") && k.text; }).slice(-6).reverse();
    if (ke.length) {
      html += '<div class="sec">Temps forts</div>';
      ke.forEach(function (k) {
        var ic = /Goal/i.test(k.type.text) ? "⚽︎" : /Red/i.test(k.type.text) ? "🟥" : /Card/i.test(k.type.text) ? "🟨" : /Substitution/i.test(k.type.text) ? "🔁" : "•";
        html += '<div class="play"><b>' + esc((k.clock && k.clock.displayValue) || "") + "</b> " + ic + " " + esc(k.text) + "</div>";
      });
    }
  }

  if (tA && tB && DX_STATS[e.sport]) {
    var va = {}, vb = {};
    (tA.statistics || []).forEach(function (s) { va[s.name] = s.displayValue; });
    (tB.statistics || []).forEach(function (s) { vb[s.name] = s.displayValue; });
    html += '<div class="sec">Statistiques</div>';
    DX_STATS[e.sport].forEach(function (k) {
      if (va[k[0]] === undefined) { return; }
      html += statBar(k[1], va[k[0]], vb[k[0]]);
    });
  }
  // NFL : actions décisives (scores)
  if (e.sport === "football" && d.scoringPlays && d.scoringPlays.length) {
    html += '<div class="sec">Points marqués</div>';
    d.scoringPlays.slice(-5).reverse().forEach(function (p) {
      html += '<div class="play"><b>' + esc((p.team && p.team.abbreviation) || "") + " · QT" + ((p.period && p.period.number) || "") + "</b> " + esc(p.text || "") + "</div>";
    });
  }

    html += '<div class="sec">Meilleurs joueurs</div><div class="ldx">';
    d.leaders.forEach(function (t) {
      html += '<div class="ldc"><div class="ldt">' + esc((t.team && (t.team.abbreviation || t.team.displayName)) || "") + "</div>";
      (t.leaders || []).slice(0, 3).forEach(function (c) {
        var l = c.leaders && c.leaders[0];
        var cat = { passingYards: "Passe", rushingYards: "Course", receivingYards: "Récep.", points: "Pts", rebounds: "Reb", assists: "Pd",
                    goals: "Buts", totalShots: "Tirs", accuratePasses: "Passes", defensiveInterventions: "Déf." }[c.name] || c.shortDisplayName || "";
        if (l && l.athlete) { html += '<div class="ldl"><span><i class="lcat">' + esc(cat) + "</i>" + esc(l.athlete.shortName || l.athlete.displayName) + "</span><b>" + esc(l.displayValue) + "</b></div>"; }
      });
      html += "</div>";
    });
    html += "</div>";
  }
  $("dx-sum").innerHTML = html || '<div class="empty-s">Pas encore de statistiques.</div>';
  $("dx-sum").scrollTop = dx.sumScroll || 0;
}

// Barre de comparaison : valeur A à gauche, B à droite
function statBar(label, a, b) {
  var na = parseFloat(String(a).replace(",", ".")), nb = parseFloat(String(b).replace(",", "."));
  if (/:/.test(a)) { na = toSec(a); nb = toSec(b); }           // temps de possession
  if (/^\d+-\d+$/.test(a)) { na = +a.split("-")[0]; nb = +b.split("-")[0]; } // "4-12"
  var tot = (na || 0) + (nb || 0), pa = tot ? Math.round((na || 0) / tot * 100) : 50;
  return '<div class="sb"><div class="sbv">' + esc(a) + '</div><div class="sbm"><div class="sbl">' + esc(label) + '</div><div class="sbbar"><i class="l" style="width:' + pa +
    '%"></i><i class="r" style="width:' + (100 - pa) + '%"></i></div></div><div class="sbv">' + esc(b) + "</div></div>";
}
function toSec(s) { var p = String(s).split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); }

/* =====================================================================
   F1 EN DIRECT (OpenF1)
   ===================================================================== */
var OF1 = "https://api.openf1.org/v1/";
var TYRES = { SOFT: ["S", "#ff3b3b"], MEDIUM: ["M", "#ffd23f"], HARD: ["H", "#f2f2f2"], INTERMEDIATE: ["I", "#3ee08f"], WET: ["W", "#3fa0ff"] };
function isoMinus(t, sec) { return new Date(t - sec * 1000).toISOString().slice(0, 19); }
function last(list, key) { var m = {}; (list || []).forEach(function (x) { m[x[key]] = x; }); return m; }

var of1Q = [], of1Busy = false;
function of1Get(url, ttl, cb) {
  var c = spCache[url];
  if (c && Date.now() - c.t < ttl * 1000) { cb(c.d); return; }
  of1Q.push([url, cb, c]); of1Pump();
}
function of1Pump() {
  if (of1Busy || !of1Q.length) { return; }
  of1Busy = true;
  var j = of1Q.shift();
  function done(d) { j[1](d); setTimeout(function () { of1Busy = false; of1Pump(); }, 400); }
  getJSON(j[0], function (d) { spCache[j[0]] = { t: Date.now(), d: d }; done(d); }, function () { done(j[2] ? j[2].d : null); });
}
function of1All(list, cb) { // list : [[url, ttl], ...]
  var res = [], left = list.length;
  list.forEach(function (x, i) { of1Get(x[0], x[1], function (d) { res[i] = d; if (--left === 0) { cb(res); } }); });
}

function f1Live() {
  if (dx.f1At && Date.now() - dx.f1At < 28000) { return; } // au plus toutes les 30 s
  dx.f1At = Date.now();
  if (!$("dx-list").querySelector(".f1t")) { $("dx-list").innerHTML = '<div class="empty-s">Chargement des données F1…</div>'; $("dx-detail").innerHTML = ""; }
  var q = "?session_key=latest";
  of1All([[OF1 + "sessions" + q, 300], [OF1 + "meetings?meeting_key=latest", 3600], [OF1 + "drivers" + q, 600], [OF1 + "race_control" + q, 25],
          [OF1 + "position" + q, 25], [OF1 + "stints" + q, 25], [OF1 + "pit" + q, 25], [OF1 + "overtakes" + q, 25]], function (r) {
    if (dx.sport !== "f1") { return; }
    var sess = r[0] && r[0][0], meet = r[1] && r[1][0];

function f1Render(sess, meet, drivers, rc, pos, stints, pits, ovt, laps, iv, weather, maxLap, isRace) {

  pits.forEach(function (p) { pitN[p.driver_number] = (pitN[p.driver_number] || 0) + 1; });
  ovt.forEach(function (o) { ovN[o.overtaking_driver_number] = (ovN[o.overtaking_driver_number] || 0) + 1; });
  laps.forEach(function (l) {

    if (l.lap_duration && (!lastLap[n] || l.lap_number > lastLap[n].lap_number)) { lastLap[n] = l; }

      "<td>" + (isRace ? gap(I[n] && I[n].gap_to_leader) : lapTime(best[n])) + '</td><td class="mut">' + (isRace ? gap(I[n] && I[n].interval) : "") + "</td>" +
      '<td><span class="tyre" style="border-color:' + ty[1] + ";color:" + ty[1] + '">' + ty[0] + '</span> <span class="mut">' + age + " t.</span></td>" +
      '<td class="mut">' + (cur || "") + "</td><td>" + (pitN[n] || 0) + "</td><td>" + (ovN[n] || 0) + '</td><td class="mut">' + lapTime(lastLap[n] && lastLap[n].lap_duration) + "</td></tr>";
  });
  html += "</table>";
  $("dx-list").innerHTML = '<div class="pane-head"><div class="label">Classement en direct</div></div>' + html;

  // Colonne de droite : séance, drapeaux, météo, direction de course, dépassements

  rc.forEach(function (m) { if (m.category === "Flag" && m.scope === "Track" || m.category === "SafetyCar") { flag = m; } });
  var ovTop = Object.keys(ovN).sort(function (a, b) { return ovN[b] - ovN[a]; }).slice(0, 3);
  var side = '<div class="gp-name grad">' + esc(meet ? gpName(meet.meeting_name || "") : sess.location) + '</div><div class="gp-sub">' + esc(sess.session_name) + " · " +
    (live ? '<span style="color:#ff3fa4">● EN DIRECT</span>' : "Terminée") + (maxLap ? " · Tour " + maxLap : "") + "</div>";
  if (!live) { side += '<div class="empty-s">Pas de séance en cours : affichage de la dernière séance. Pendant une séance, le temps réel OpenF1 peut être réservé aux abonnés (les données arrivent alors à la fin).</div>'; }

<script>
/* =====================================================================
   ONGLET TV — programme de la TNT, 1re et 2e parties de soirée
   Source : xmltvfr.fr (guide XMLTV gratuit, ~9 jours, lecture autorisée).
   Le fichier (~840 Ko compressé) est téléchargé une fois par jour ; on n'en
   garde que les soirées, mémorisées sur l'iPad.
   ===================================================================== */
var TV_URL = "https://xmltvfr.fr/xmltv/xmltv_tnt.xml";
// Chaînes gratuites de la TNT, dans l'ordre du guide (chaînes payantes exclues)
var TV_SKIP = { "CanalPlusSport.fr": 1, "CanalPlusCinema.fr": 1, "PlanetePlus.fr": 1, "ParisPremiere.fr": 1 };
var TV_CATS = [
  ["all", "Tout", null], ["film", "Films", /Film|Téléfilm/i], ["serie", "Séries", /Série|Feuilleton/i],
  ["sport", "Sport", /Sport|Football|Rugby|Tennis|Cyclisme|Basket|Handball/i],
  ["divert", "Divertissement", /Divertissement|Jeu|Variétés|Spectacle|Musique|Humour|Téléréalité/i],
  ["doc", "Docs & magazines", /Documentaire|Magazine|Reportage|Débat|Information/i]
];
var tv = { data: null, day: null, cat: store.get("tvCat") || "all", loading: false };

function xmlDecode(s) {
  return String(s || "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#039;|&apos;/g, "'").replace(/&amp;/g, "&");
}
function tag(block, name) {
  var m = new RegExp("<" + name + "[^>]*>([\\s\\S]*?)</" + name + ">").exec(block);
  return m ? xmlDecode(m[1].trim()) : "";
}

// Extraction légère (expressions régulières, pas d'arbre XML : plus sûr pour la mémoire d'un vieil iPad)
function tvParse(xml) {
  var chans = [], keep = {}, m;
  var reC = /<channel id="([^"]+)">([\s\S]*?)<\/channel>/g;
  while ((m = reC.exec(xml))) {
    if (TV_SKIP[m[1]]) { continue; }
    var icon = /<icon src="([^"]+)"/.exec(m[2]);
    keep[m[1]] = true;
    chans.push({ id: m[1], name: tag(m[2], "display-name"),
                 logo: icon ? icon[1].replace("/480x480/quality/100/", "/80x80/quality/80/").replace(/^http:/, "https:") : "" });
  }
  var days = {};
  var reP = /<programme start="(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)\d\d [+-]\d{4}" stop="(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)\d\d [+-]\d{4}" channel="([^"]+)">([\s\S]*?)<\/programme>/g;
  while ((m = reP.exec(xml))) {
    var h = +m[4];
    if (!keep[m[11]] || (h < 20 && h > 1)) { continue; } // soirée : 20 h -> 1 h du matin
    var start = new Date(+m[1], +m[2] - 1, +m[3], h, +m[5]), stop = new Date(+m[6], +m[7] - 1, +m[8], +m[9], +m[10]);
    var eve = h <= 1 ? dayStart(start, -1) : dayStart(start), key = ymd(eve), b = m[12];
    var ep = /<episode-num system="xmltv_ns">\s*(\d*)\.(\d*)\./.exec(b), rating = /<rating[^>]*>\s*<value>([^<]*)<\/value>/.exec(b);
    var p = { s: start.getTime(), e: stop.getTime(), ti: tag(b, "title"), st: tag(b, "sub-title"), c: tag(b, "category"),
              de: tag(b, "desc").slice(0, 280), r: rating ? rating[1] : "",
              ep: ep && ep[2] !== "" ? (ep[1] !== "" ? "S" + (+ep[1] + 1) + " " : "") + "É" + (+ep[2] + 1) : "" };
    ((days[key] = days[key] || {})[m[11]] = days[key][m[11]] || []).push(p);
  }
  // Pour chaque soirée et chaque chaîne : 1re partie (début entre 20 h 35 et 21 h 45, 25 min mini) puis 2e partie
  var out = {};
  Object.keys(days).forEach(function (k) {
    out[k] = {};
    Object.keys(days[k]).forEach(function (ch) {
      var list = days[k][ch].sort(function (a, b) { return a.s - b.s; }), p1 = null, p2 = null;
      // 1) début entre 20 h 50 et 21 h 45, au moins 40 min (évite les séries d'avant-soirée de 20 h 45)
      function pick(minDur) {
