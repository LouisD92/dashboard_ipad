<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Plein écran quand la page est ajoutée à l'écran d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dash">
<title>Dash</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- ================= BARRE LATÉRALE ================= -->
  <nav id="side">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd166"/><stop offset=".45" stop-color="#ff9e4f"/><stop offset="1" stop-color="#ff3fa4"/>
          </linearGradient>
          <clipPath id="lg-clip"><rect x="0" y="0" width="48" height="30"/></clipPath>
        </defs>
        <circle cx="24" cy="27" r="16" fill="url(#lg-sun)" clip-path="url(#lg-clip)"/>
        <rect x="6" y="18" width="36" height="1.2" fill="#0e0820"/>
        <rect x="6" y="22" width="36" height="1.8" fill="#0e0820"/>
        <rect x="6" y="26" width="36" height="2.4" fill="#0e0820"/>
        <g stroke="#2de2e6" stroke-width="1" fill="none" opacity=".9">
          <path d="M2 31h44"/><path d="M5 36h38" opacity=".7"/><path d="M3 42h42" opacity=".5"/>
          <path d="M24 31v15M18 31l-8 15M30 31l8 15M12 31L0 44M36 31l12 13" opacity=".6"/>
        </g>
      </svg>
      <div class="logo-t">DASH</div>
    </div>

    <button class="tab" data-tab="meteo">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="11" r="4.5"/>
        <path d="M12 2.5v2M3.5 11h2M5.9 4.9l1.4 1.4M18.1 4.9l-1.4 1.4"/>
        <path d="M10 27h13.5a5 5 0 0 0 .4-10 7 7 0 0 0-13.3 1.6A4.2 4.2 0 0 0 10 27z" fill="#100a20"/>
      </svg>
      <span>Météo</span>
    </button>

    <button class="tab" data-tab="radar">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="16" cy="16" r="13.5" opacity=".55"/>
        <circle cx="16" cy="16" r="8" opacity=".55" stroke-dasharray="2 3"/>
        <path transform="translate(7 7) scale(.75)" fill="currentColor" stroke="none"
              d="M12 1.5c.9 0 1.4 1 1.4 2.2v5.4l8.1 4.8v2.1l-8.1-2.4v4.9l2.4 1.8v1.8L12 21.2l-3.8.9v-1.8l2.4-1.8v-4.9l-8.1 2.4v-2.1l8.1-4.8V3.7c0-1.2.5-2.2 1.4-2.2z"/>
      </svg>
      <span>Radar</span>
    </button>

    <div class="side-clock"><div id="s-time" class="grad">--:--</div><div id="s-date"></div></div>
  </nav>

  <main id="pages">

    <!-- ================= MÉTÉO ================= -->
    <section class="page" id="page-meteo">
      <div class="card" id="main">
        <div id="time">--:--</div>
        <div id="date"></div>
        <div id="cities"></div>
        <div class="sep"></div>
        <div id="now">
          <div id="now-icon">·</div>
          <div>
            <div id="now-temp">--°</div>
            <div id="now-desc">Chargement…</div>
            <div id="now-minmax"></div>
          </div>
        </div>
        <div id="nowcast">…</div>
        <div id="astro"></div>
      </div>

      <div class="card" id="map-card">
        <div id="map"></div>
        <div class="map-info" id="map-info"></div>
      </div>

      <div id="tiles"></div>

      <div class="card" id="hourly-card">
        <div class="head"><div class="label">Prochaines 24 heures</div><div class="status" id="m-status"></div></div>
        <div class="hrow" id="h-top"></div>
        <div id="h-curve"></div>
        <div class="hrow" id="h-rain"></div>
      </div>

      <div class="card" id="daily-card">
        <div class="head"><div class="label">7 jours</div></div>
        <div id="daily"></div>
      </div>
    </section>

    <!-- ================= RADAR (avions) ================= -->
    <section class="page" id="page-radar">
      <div class="card" id="r-map-card">
        <div id="r-map"></div>
        <svg id="r-sweep" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="sw" x1="1" y1="0" x2="0" y2=".35">
              <stop offset="0" stop-color="#2de2e6" stop-opacity=".28"/>
              <stop offset="1" stop-color="#2de2e6" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M50 50 L50 0 A50 50 0 0 0 17.86 11.7 Z" fill="url(#sw)"/>
          <path d="M50 50 L50 0" stroke="#2de2e6" stroke-width=".25" opacity=".8"/>
        </svg>
        <div id="r-legend">
          Altitude
          <div class="gb"></div>
          <div class="gl"><span>0</span><span>3 000</span><span>7 500</span><span>12 000 m</span></div>
        </div>
      </div>

      <div id="r-side">
        <div class="card" id="r-head">
          <div class="head"><div class="title-big grad">Radar aérien</div><div class="status" id="r-status"></div></div>
          <div class="status" id="r-where"></div>
          <div id="r-cities"></div>
          <div class="stats" id="r-stats"></div>
        </div>
        <div class="card" id="r-detail"></div>
        <div class="card" id="r-list-card">
          <div class="label">À proximité</div>
          <div id="r-list"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/commun.js"></script>
<script src="js/meteo.js"></script>
<script src="js/avions.js"></script>
<script>startApp();</script>
</body>
</html>
